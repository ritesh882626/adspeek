<script>
/**
 * App.html
 * Main client-side application logic for the AdsPeek Package Builder.
 * Fast, robust single-render per step architecture with event delegation,
 * responsive fixed layouts, working steppers, and full-screen modal controls.
 */

(function () {
  'use strict';


  // --- Step sequence definition ---
  const STEP_FLOW = [
    'service',
    'catalogue',
    'pages',
    'features',
    'integrations',
    'summary',
    'details'
  ];

  // --- Application State ---
  const state = {
    currentScreen: 'welcome',
    role: 'client', // 'client' | 'staff'
    isStaff: false,
    staffToken: null,
    selectedServiceId: 'SHOPIFY',
    selections: {}, // { [componentId]: number }
    featureTagFilter: 'All',
    customLines: [], // staff only: [{ name, amount, discountable }]
    finalPriceOverride: null, // staff only
    discountReason: '',
    staffName: '',
    client: {
      name: '',
      businessName: '',
      mobile: '',
      email: '',
      gstin: '',
      stateCode: '',
      address: '',
      whatsappOptIn: true
    },
    fieldErrors: {},
    submissionResult: null,
    catalog: null,
    quoteResult: null,
    isSubmitting: false
  };

  // Stepper repeater hold timer state
  let holdTimer = null;
  let repeatInterval = null;
  let stepperDebounceTimer = null;

  // --- Utility Helpers ---
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatRupee(n) {
    return new Intl.NumberFormat('en-IN', {
      style: 'currency',
      currency: 'INR',
      maximumFractionDigits: 0
    }).format(Math.round(Number(n) || 0));
  }

  function formatRupeeExact(n) {
    return new Intl.NumberFormat('en-IN', {
      style: 'currency',
      currency: 'INR',
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }).format(Number(n) || 0);
  }

  function showToast(message, isError) {
    let toast = document.getElementById('toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast';
      toast.className = 'toast-msg';
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.style.background = isError ? '#DC2626' : '#111827';
    toast.classList.add('show');
    setTimeout(function () {
      toast.classList.remove('show');
    }, 3500);
  }

  // --- Unsaved Changes Detection ---
  function hasUnsavedChanges() {
    if (state.currentScreen === 'welcome' || state.currentScreen === 'confirmation') return false;
    const hasSelections = Object.keys(state.selections).length > 0;
    const hasCustomLines = state.customLines.length > 0;
    const hasClientData = Boolean(
      state.client.name.trim() ||
      state.client.mobile.trim() ||
      state.client.email.trim()
    );
    return hasSelections || hasCustomLines || hasClientData;
  }

  // --- Close Protocol & PostMessage ---
  function requestClose() {
    if (hasUnsavedChanges()) {
      const modal = document.getElementById('leave-confirm-modal');
      if (modal) modal.hidden = false;
    } else {
      doClose();
    }
  }

  function doClose() {
    try {
      window.top.postMessage({ source: 'adspeek-estimate', action: 'close' }, '*');
    } catch (e) {}

    // Reset local selections & navigate to welcome
    state.selections = {};
    state.customLines = [];
    state.finalPriceOverride = null;
    state.discountReason = '';
    state.client = {
      name: '',
      businessName: '',
      mobile: '',
      email: '',
      gstin: '',
      stateCode: '',
      address: '',
      whatsappOptIn: true
    };
    state.fieldErrors = {};
    const modal = document.getElementById('leave-confirm-modal');
    if (modal) modal.hidden = true;
    navigate('welcome');
  }

  // --- Client-Server Promise Wrapper ---
  function callServer(fnName) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        return handleMockCall(fnName, args, resolve, reject);
      }
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[fnName].apply(google.script.run, args);
    });
  }

  // Fallback Mock for local development
  function handleMockCall(fnName, args, resolve, reject) {
    if (fnName === 'getCatalog') {
      resolve({
        services: [
          { id: 'SHOPIFY', name: 'Shopify Store', basePrice: 24999, description: 'Best for standard e-commerce brands' },
          { id: 'CUSTOM_NEXTJS', name: 'Custom Next.js Store', basePrice: 44999, description: 'Headless storefront for max speed & control' }
        ],
        components: [
          { id: 'CAT-PROD', serviceId: 'SHOPIFY', step: 'Catalogue', name: 'Products', type: 'Quantity', includedQty: 20, minQty: 20, maxQty: 1000, rate: 2000, batchSize: 20, unit: 'products', discountable: true },
          { id: 'CAT-CATG', serviceId: 'SHOPIFY', step: 'Catalogue', name: 'Categories', type: 'Quantity', includedQty: 5, minQty: 5, maxQty: 50, rate: 1000, batchSize: 5, unit: 'categories', discountable: true },
          { id: 'PAGE-HOME', serviceId: 'SHOPIFY', step: 'Pages', name: 'Homepage', type: 'Included', includedQty: 1, rate: 0, discountable: false },
          { id: 'PAGE-COLLECTION', serviceId: 'SHOPIFY', step: 'Pages', name: 'Collection page', type: 'Included', includedQty: 1, rate: 0, discountable: false },
          { id: 'PAGE-PRODUCT', serviceId: 'SHOPIFY', step: 'Pages', name: 'Product page', type: 'Included', includedQty: 1, rate: 0, discountable: false },
          { id: 'PAGE-CART', serviceId: 'SHOPIFY', step: 'Pages', name: 'Cart & Checkout', type: 'Included', includedQty: 1, rate: 0, discountable: false },
          { id: 'PAGE-ABOUT', serviceId: 'SHOPIFY', step: 'Pages', name: 'About Us', type: 'Optional', rate: 2500, discountable: true },
          { id: 'PAGE-CONTACT', serviceId: 'SHOPIFY', step: 'Pages', name: 'Contact Us', type: 'Optional', rate: 1500, discountable: true },
          { id: 'PAGE-LANDING', serviceId: 'SHOPIFY', step: 'Pages', name: 'Extra Landing Page', type: 'Optional + Qty', rate: 2500, unit: 'page', discountable: true },
          { id: 'FEAT-REVIEWS', serviceId: 'SHOPIFY', step: 'Features', name: 'Product reviews & ratings', type: 'Optional', rate: 3000, tag: 'Conversion', description: 'Social proof on product and home pages', discountable: true },
          { id: 'FEAT-WISHLIST', serviceId: 'SHOPIFY', step: 'Features', name: 'Wishlist feature', type: 'Optional', rate: 2500, tag: 'Design', description: 'Let visitors save items for later', discountable: true },
          { id: 'INTG-PAYMENT', serviceId: 'SHOPIFY', step: 'Integrations', name: 'Payment gateway (Razorpay / Cashfree)', type: 'Included', rate: 0, discountable: false },
          { id: 'INTG-WHATSAPP', serviceId: 'SHOPIFY', step: 'Integrations', name: 'WhatsApp chat & order updates', type: 'Optional', rate: 2500, discountable: true }
        ],
        settings: {
          homeStateCode: 'DL',
          gstRate: 0.18,
          maxStaffDiscount: 0.15
        },
        states: [
          { code: 'DL', name: 'Delhi' },
          { code: 'MH', name: 'Maharashtra' },
          { code: 'KA', name: 'Karnataka' },
          { code: 'TN', name: 'Tamil Nadu' },
          { code: 'UP', name: 'Uttar Pradesh' },
          { code: 'HR', name: 'Haryana' },
          { code: 'GJ', name: 'Gujarat' }
        ]
      });
      return;
    }
    if (fnName === 'staffLogin') {
      if (args[0] === 'adspeek2026') {
        resolve({ token: 'mock-staff-token', success: true });
      } else {
        reject(new Error('Incorrect password.'));
      }
      return;
    }
    if (fnName === 'saveSubmission') {
      resolve({ submissionId: 'AP-' + Math.floor(100000 + Math.random() * 900000), success: true });
      return;
    }
    reject(new Error('Unknown function ' + fnName));
  }

  // --- Recalculate Quote ---
  function recalc() {
    if (!state.catalog) return;

    const selections = [];
    Object.keys(state.selections).forEach(function (cid) {
      const q = state.selections[cid];
      if (q > 0) selections.push({ componentId: cid, qty: q });
    });

    const payload = {
      serviceId: state.selectedServiceId,
      selections: selections,
      customLines: state.customLines,
      finalPriceOverride: state.finalPriceOverride,
      client: state.client
    };

    state.quoteResult = computeQuote(state.catalog, payload, state.isStaff);
    updatePriceUI();
  }

  // --- Update Price UI In Place (DOES NOT TOUCH OPTIONS AREA DOM) ---
  function updatePriceUI() {
    const res = state.quoteResult;
    if (!res) return;

    const sc = state.currentScreen;
    let formatted = '';
    let note = '';

    if (sc === 'welcome' || sc === 'staff_login' || !state.selectedServiceId) {
      formatted = '—';
      note = 'Select a service to start';
    } else if (sc === 'service') {
      formatted = formatRupee(res.basePrice);
      note = 'Base package · GST extra';
    } else if (sc === 'catalogue') {
      formatted = formatRupee(res.expectedPrice);
      const extraCat = res.expectedPrice - res.basePrice;
      note = extraCat > 0 ? '+' + formatRupee(extraCat) + ' for extra items' : 'Included in base package';
    } else if (sc === 'pages') {
      formatted = formatRupee(res.expectedPrice);
      let pageCount = 0;
      state.catalog.components.forEach(function (c) {
        if (c.step === 'Pages' && c.type !== 'Included' && state.selections[c.id] > 0) pageCount++;
      });
      note = pageCount > 0 ? pageCount + ' extra page' + (pageCount > 1 ? 's' : '') + ' added' : 'Essential pages included';
    } else if (sc === 'features') {
      formatted = formatRupee(res.expectedPrice);
      let featCount = 0;
      state.catalog.components.forEach(function (c) {
        if (c.step === 'Features' && state.selections[c.id] > 0) featCount++;
      });
      note = featCount > 0 ? featCount + ' feature' + (featCount > 1 ? 's' : '') + ' added' : 'Optional upgrades';
    } else if (sc === 'integrations') {
      formatted = formatRupee(res.expectedPrice);
      note = 'Setup charges only';
    } else if (sc === 'summary' || sc === 'details' || sc === 'confirmation') {
      formatted = formatRupeeExact(res.grandTotal);
      note = 'Including GST';
    } else {
      formatted = formatRupee(res.expectedPrice);
      note = 'GST extra';
    }

    // 1. Desktop Left Panel Price Card
    const priceEl = document.getElementById('lp-price-val');
    const noteEl = document.getElementById('lp-price-note');
    if (priceEl && priceEl.textContent !== formatted) {
      priceEl.textContent = formatted;
      priceEl.classList.remove('price-pulse');
      void priceEl.offsetWidth; // trigger reflow
      priceEl.classList.add('price-pulse');
    }
    if (noteEl) noteEl.textContent = note;

    // 2. Mobile Sticky Bottom Bar Price
    const mobilePriceEl = document.getElementById('mobile-estimate-price');
    if (mobilePriceEl) {
      if (sc === 'welcome' || sc === 'staff_login' || !state.selectedServiceId) {
        mobilePriceEl.textContent = '—';
      } else if (sc === 'summary' || sc === 'details') {
        mobilePriceEl.textContent = formatRupeeExact(res.grandTotal);
      } else {
        mobilePriceEl.textContent = formatRupee(res.expectedPrice);
      }
    }

    updateBreakdownSheet();

    // 3. Summary Screen Totals (if visible)
    const sumSubtotal = document.getElementById('summary-subtotal');
    const sumGstLabel = document.getElementById('summary-gst-label');
    const sumGst = document.getElementById('summary-gst');
    const sumTotal = document.getElementById('summary-grand-total');
    if (sumSubtotal) sumSubtotal.textContent = formatRupee(res.finalPrice);
    if (sumGstLabel) sumGstLabel.textContent = res.taxType;
    if (sumGst) sumGst.textContent = formatRupeeExact(res.gstAmount);
    if (sumTotal) sumTotal.textContent = formatRupeeExact(res.grandTotal);

    // 4. Staff Summary Override Indicators
    const staffExpectedEl = document.getElementById('staff-expected-val');
    const staffDiscEl = document.getElementById('staff-disc-pill');
    if (staffExpectedEl) staffExpectedEl.textContent = formatRupee(res.expectedPrice);
    if (staffDiscEl) {
      if (res.discountPct > 0) {
        staffDiscEl.textContent = 'Discount ' + res.discountPct + '%';
        staffDiscEl.style.display = 'inline-block';
      } else {
        staffDiscEl.style.display = 'none';
      }
    }
  }

  // --- Screen Navigation ---
  function navigate(screenName) {
    state.currentScreen = screenName;
    recalc();
    renderApp();
    const scrollArea = document.querySelector('.options-scroll-area');
    if (scrollArea) scrollArea.scrollTop = 0;
  }

  // --- Step Dots Component ---
  function renderStepDots(activeScreenName) {
    const currentIndex = STEP_FLOW.indexOf(activeScreenName);
    if (currentIndex === -1) return '';

    const totalSteps = STEP_FLOW.length;
    const progressPct = (currentIndex / (totalSteps - 1)) * 100;

    let dotsHtml = '';
    for (let i = 0; i < totalSteps; i++) {
      let cls = 'step-dot';
      if (i === currentIndex) cls += ' active';
      else if (i < currentIndex) cls += ' completed';
      dotsHtml += '<div class="' + cls + '" data-step-index="' + i + '"></div>';
    }

    return (
      '<div class="step-dots-container">' +
        '<div class="step-dots-line"></div>' +
        '<div class="step-dots-progress" style="width: ' + progressPct + '%;"></div>' +
        '<div class="step-dots-wrapper">' + dotsHtml + '</div>' +
      '</div>'
    );
  }

  // --- Left Panel Content Renderer ---
  function renderLeftPanel() {
    const sc = state.currentScreen;
    let title = 'Get your store estimate';
    let desc = 'Build your package in a few steps and see the exact price as you go.';
    let extraHtml = '';

    if (sc === 'welcome') {
      title = 'Get your store estimate';
      desc = 'Build your package in a few steps and see the exact price as you go.';
      extraHtml = (
        '<div class="benefit-list">' +
          '<div class="benefit-item"><span>Fixed, transparent pricing</span></div>' +
          '<div class="benefit-item"><span>Takes about 3 minutes</span></div>' +
          '<div class="benefit-item"><span>No sign-up needed</span></div>' +
        '</div>'
      );
    } else if (sc === 'staff_login') {
      title = 'Staff portal';
      desc = 'Log in with your team password to create, customize, and discount client quotes.';
    } else if (sc === 'service') {
      title = 'Build your package';
      desc = 'Pick a service to see its base price. You can add pages, features and integrations next.';
    } else if (sc === 'catalogue') {
      title = 'Your catalogue';
      desc = 'Tell us how many products and categories your store will launch with.';
    } else if (sc === 'pages') {
      title = 'Store pages';
      desc = 'Essential pages are already included. Add any extra pages your brand needs.';
    } else if (sc === 'features') {
      title = 'Features';
      desc = 'Add design upgrades and tools that help your store sell more.';
    } else if (sc === 'integrations') {
      title = 'Integrations';
      desc = 'Connect your store to the tools that run your business. Tool subscriptions are paid directly to the provider.';
    } else if (sc === 'summary') {
      if (state.isStaff) {
        title = 'Quote for client';
        desc = 'Adjust the final price if needed. The difference is spread across discountable items automatically.';
      } else {
        title = 'Your package';
        desc = 'Here\'s everything included. Prices are fixed; GST is added at 18%.';
        extraHtml = (
          '<div class="benefit-list">' +
            '<div class="benefit-item"><span>Delivery in about 20 working days</span></div>' +
            '<div class="benefit-item"><span>50% advance to start</span></div>' +
            '<div class="benefit-item"><span>Free support after launch</span></div>' +
          '</div>'
        );
      }
    } else if (sc === 'details') {
      title = 'Almost done';
      desc = 'Share your details and we\'ll email your estimate right away.';
    } else if (sc === 'confirmation') {
      const clientName = state.client.name ? escapeHtml(state.client.name) : 'there';
      const clientEmail = state.client.email ? escapeHtml(state.client.email) : 'your email';
      title = 'Thank you, ' + clientName;
      desc = 'Your estimate is on its way to ' + clientEmail + '.';
    }

    return (
      '<div class="left-panel">' +
        '<div>' +
          '<div class="brand-badge">' +
            (window.ADSPEEK_LOGO_HTML || '') +
            '<span class="brand-text">AdsPeek</span>' +
          '</div>' +
          '<h1 class="left-title">' + title + '</h1>' +
          '<p class="left-desc">' + desc + '</p>' +
          extraHtml +
        '</div>' +
        '<div class="price-card">' +
          '<div class="price-card-label">Your estimate</div>' +
          '<div class="price-card-amount" id="lp-price-val">—</div>' +
          '<div class="price-card-subtext" id="lp-price-note">Select a service to start</div>' +
        '</div>' +
      '</div>'
    );
  }

  // ==========================================================================
  // Screen Renderers
  // ==========================================================================

  // 1. Welcome Screen
  function renderWelcome() {
    const isClient = state.role === 'client';
    const isStaff = state.role === 'staff';

    return (
      '<div class="screen-header-wrap">' +
        '<h2 class="screen-title">Choose how to start</h2>' +
        '<p class="screen-subtitle">Build as a client or access the staff portal</p>' +
      '</div>' +
      '<div class="options-scroll-area">' +
        '<div class="tiles-grid-2">' +
          '<div class="tile tile-large ' + (isClient ? 'selected' : '') + '" data-action="set-role" data-role="client" tabindex="0" role="checkbox" aria-checked="' + isClient + '">' +
            '<span class="tile-pill-selected">Selected</span>' +
            '<div class="tile-content">' +
              '<div class="tile-title" style="font-size:16px;margin-bottom:6px;">I am a client</div>' +
              '<div class="tile-desc" style="font-size:13px;line-height:1.5;">Explore packages, customise options, and get an instant estimate.</div>' +
            '</div>' +
          '</div>' +
          '<div class="tile tile-large ' + (isStaff ? 'selected' : '') + '" data-action="set-role" data-role="staff" tabindex="0" role="checkbox" aria-checked="' + isStaff + '">' +
            '<span class="tile-pill-selected">Selected</span>' +
            '<div class="tile-content">' +
              '<div class="tile-title" style="font-size:16px;margin-bottom:6px;">AdsPeek team</div>' +
              '<div class="tile-desc" style="font-size:13px;line-height:1.5;">Log in to create custom quotes and apply staff discounts.</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="screen-footer-wrap">' +
        '<div class="screen-footer" style="justify-content:flex-end;">' +
          '<button type="button" class="btn-primary" data-action="welcome-continue">Continue</button>' +
        '</div>' +
      '</div>'
    );
  }

  // 2. Staff Login Screen
  function renderStaffLogin() {
    return (
      '<div class="screen-header-wrap">' +
        '<h2 class="screen-title">Staff login</h2>' +
        '<p class="screen-subtitle">Enter team password to access staff tools</p>' +
      '</div>' +
      '<div class="options-scroll-area">' +
        '<div style="max-width:380px;margin-top:16px;">' +
          '<div class="form-group">' +
            '<label class="form-label" for="staff-pw-input">Team password</label>' +
            '<div class="password-input-wrap">' +
              '<input type="password" id="staff-pw-input" class="form-input" placeholder="Enter staff password" autocomplete="current-password">' +
              '<button type="button" class="pw-toggle-btn" data-action="toggle-password">Show</button>' +
            '</div>' +
            '<span class="field-error-msg" id="staff-login-error" style="display:none;"></span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="screen-footer-wrap">' +
        '<div class="screen-footer">' +
          '<button type="button" class="prev-step-btn" data-action="nav-screen" data-target="welcome">Back</button>' +
          '<button type="button" class="btn-primary" data-action="staff-login">Log in</button>' +
        '</div>' +
      '</div>'
    );
  }

  // 3. Service Selection (Step 1)
  function renderService() {
    const services = state.catalog.services || [];
    let tilesHtml = '';

    services.forEach(function (s) {
      const isSel = s.id === state.selectedServiceId;

      tilesHtml += (
        '<div class="tile tile-large ' + (isSel ? 'selected' : '') + '" data-action="select-service" data-service-id="' + s.id + '" tabindex="0" role="checkbox" aria-checked="' + isSel + '">' +
          '<span class="tile-pill-selected">Selected</span>' +
          '<div class="tile-content">' +
            '<div class="tile-title" style="font-size:16px;margin-bottom:6px;">' + escapeHtml(s.name) + '</div>' +
            '<div class="tile-desc" style="font-size:13px;line-height:1.5;">' + escapeHtml(s.description || '') + '</div>' +
          '</div>' +
          '<div class="tile-side">' +
            '<span class="tile-price" style="font-size:16px;">' + formatRupee(s.basePrice) + '</span>' +
          '</div>' +
        '</div>'
      );
    });

    return (
      '<div class="screen-header-wrap">' +
        '<h2 class="screen-title">Select a service</h2>' +
        '<p class="screen-subtitle">Choose the platform or service you want to build</p>' +
        renderStepDots('service') +
      '</div>' +
      '<div class="options-scroll-area">' +
        '<div class="tiles-grid-2">' + tilesHtml + '</div>' +
      '</div>' +
      '<div class="screen-footer-wrap">' +
        '<div class="screen-footer">' +
          '<button type="button" class="prev-step-btn" data-action="nav-screen" data-target="welcome">Previous step</button>' +
          '<button type="button" class="btn-primary" data-action="nav-next">Continue</button>' +
        '</div>' +
      '</div>'
    );
  }

  // 4. Products and Categories (Step 2)
  function renderCatalogue() {
    const comps = state.catalog.components.filter(function (c) {
      return c.serviceId === state.selectedServiceId && c.step === 'Catalogue';
    });

    let steppersHtml = '';
    comps.forEach(function (c) {
      const currentQty = state.selections[c.id] !== undefined ? state.selections[c.id] : c.includedQty;
      const min = c.minQty !== null && c.minQty !== undefined ? c.minQty : c.includedQty;
      const max = c.maxQty !== null && c.maxQty !== undefined ? c.maxQty : 1000;
      const extra = Math.max(0, currentQty - c.includedQty);
      let helper = '';

      if (c.batchSize > 0) {
        const batches = Math.ceil(extra / c.batchSize);
        const extraCost = batches * c.rate;
        helper = c.includedQty + ' included · ' + extra + ' extra = ' + formatRupee(extraCost) + ' (' + formatRupee(c.rate) + ' per ' + c.batchSize + ' ' + (c.unit || 'items') + ')';
      } else {
        const extraCost = extra * c.rate;
        helper = c.includedQty + ' included · ' + extra + ' extra × ' + formatRupee(c.rate) + ' = ' + formatRupee(extraCost);
      }

      steppersHtml += (
        '<div class="stepper-card" data-comp-id="' + c.id + '">' +
          '<div class="stepper-header">' +
            '<div class="stepper-left">' +
              '<span class="stepper-title">' + escapeHtml(c.name) + '</span>' +
            '</div>' +
            '<div class="stepper-control">' +
              '<button type="button" class="stepper-btn" data-action="qty-dec" data-comp-id="' + c.id + '" ' + (currentQty <= min ? 'disabled aria-disabled="true"' : '') + '>−</button>' +
              '<input type="text" inputmode="numeric" pattern="[0-9]*" class="stepper-input" data-comp-id="' + c.id + '" value="' + currentQty + '" aria-label="' + escapeHtml(c.name) + ' quantity">' +
              '<button type="button" class="stepper-btn" data-action="qty-inc" data-comp-id="' + c.id + '" ' + (currentQty >= max ? 'disabled aria-disabled="true"' : '') + '>+</button>' +
            '</div>' +
          '</div>' +
          '<div class="stepper-helper" id="helper-' + c.id + '">' + helper + '</div>' +

  // 5. Choose Your Pages (Step 3)
  function renderPages() {

    let includedChipsHtml = '';
    includedPages.forEach(function (c) {

          '<span class="chip-pill-included">Included</span>' +
        '</div>'
      );
    });

    let optionalTilesHtml = '';
    optionalPages.forEach(function (c) {
      const isSelected = Boolean(state.selections[c.id]);
      let priceLabel = formatRupee(c.rate);

      if (c.type === 'Optional + Qty') {
        priceLabel += ' per ' + (c.unit || 'page');
        const currentQty = state.selections[c.id] || 1;

        optionalTilesHtml += (
          '<div class="tile tile-with-stepper ' + (isSelected ? 'selected' : '') + '" data-comp-id="' + c.id + '">' +
            '<button type="button" class="tile-main-btn" data-action="toggle-opt-qty" data-comp-id="' + c.id + '" role="checkbox" aria-checked="' + isSelected + '">' +
              '<span class="tile-pill-selected">Selected</span>' +
              '<div class="tile-content">' +
                '<div class="tile-title">' + escapeHtml(c.name) + '</div>' +
              '</div>' +
              '<div class="tile-side">' +
                '<span class="tile-price">' + priceLabel + '</span>' +
              '</div>' +
            '</button>' +
            '<div class="tile-stepper-row" style="' + (isSelected ? 'display:flex;' : 'display:none;') + '">' +
              '<span class="tile-stepper-label">' + escapeHtml(c.unit || 'Pages') + '</span>' +
              '<div class="stepper-control">' +
                '<button type="button" class="stepper-btn" data-action="qty-dec" data-comp-id="' + c.id + '" ' + (currentQty <= 1 ? 'disabled aria-disabled="true"' : '') + '>−</button>' +
                '<input type="text" inputmode="numeric" pattern="[0-9]*" class="stepper-input" data-comp-id="' + c.id + '" value="' + currentQty + '">' +

          '<div class="tile ' + (isSelected ? 'selected' : '') + '" data-action="toggle-tile" data-comp-id="' + c.id + '" tabindex="0" role="checkbox" aria-checked="' + isSelected + '">' +
            '<span class="tile-pill-selected">Selected</span>' +
            '<div class="tile-content">' +
              '<div class="tile-title">' + escapeHtml(c.name) + '</div>' +

            '<div class="tile-side">' +
              '<span class="tile-price">' + priceLabel + '</span>' +

    return (
      '<div class="screen-header-wrap">' +
        '<h2 class="screen-title">Choose your pages</h2>' +
        '<p class="screen-subtitle">Essential pages are already included. Add any extra pages your brand needs.</p>' +
        renderStepDots('pages') +
      '</div>' +
      '<div class="options-scroll-area">' +
        '<div class="section-group-label">Included in your package</div>' +
        '<div class="locked-chips-grid">' + includedChipsHtml + '</div>' +
        '<div class="section-group-label">Add more pages</div>' +
        '<div class="tiles-grid-2">' + optionalTilesHtml + '</div>' +
      '</div>' +
      '<div class="screen-footer-wrap">' +
        '<div class="screen-footer">' +
          '<button type="button" class="prev-step-btn" data-action="nav-prev">Previous step</button>' +
          '<button type="button" class="btn-primary" data-action="nav-next">Continue</button>' +
        '</div>' +
      '</div>'
    );
  }

  // 6. Add Features (Step 4)
  function renderFeatures() {
    const features = state.catalog.components.filter(function (c) {
      if (c.serviceId !== state.selectedServiceId || c.step !== 'Features') return false;
      if (!state.isStaff && c.visibleTo === 'Staff') return false;
      return true;
    });

    const tags = ['All'];
    features.forEach(function (f) {
      if (f.tag && tags.indexOf(f.tag) === -1) tags.push(f.tag);
    });

    let pillsHtml = '';
    if (tags.length > 1) {
      pillsHtml = '<div class="filter-pills">';
      tags.forEach(function (tag) {
        const activeCls = state.featureTagFilter === tag ? 'active' : '';
        pillsHtml += '<button type="button" class="filter-pill ' + activeCls + '" data-action="filter-tag" data-tag="' + escapeHtml(tag) + '">' + escapeHtml(tag) + '</button>';
      });
      pillsHtml += '</div>';
    }

    let tilesHtml = '';
    features.forEach(function (f) {
      const isSelected = Boolean(state.selections[f.id]);
      const isVisible = state.featureTagFilter === 'All' || f.tag === state.featureTagFilter;

      tilesHtml += (
        '<div class="tile ' + (isSelected ? 'selected' : '') + '" data-action="toggle-tile" data-comp-id="' + f.id + '" data-tag="' + escapeHtml(f.tag || 'All') + '" style="' + (isVisible ? '' : 'display:none;') + '" tabindex="0" role="checkbox" aria-checked="' + isSelected + '">' +
          '<span class="tile-pill-selected">Selected</span>' +
          '<div class="tile-content">' +
            '<div class="tile-title">' +
              escapeHtml(f.name) +
              (f.visibleTo === 'Staff' ? '<span class="staff-pill">Staff</span>' : '') +
            '</div>' +
            (f.description ? '<div class="tile-desc">' + escapeHtml(f.description) + '</div>' : '') +
          '</div>' +
          '<div class="tile-side">' +
            '<span class="tile-price">' + formatRupee(f.rate) + '</span>' +
          '</div>' +
        '</div>'
      );
    });

    return (
      '<div class="screen-header-wrap">' +
        '<h2 class="screen-title">Add features</h2>' +
        '<p class="screen-subtitle">All optional. Pick what fits your brand.</p>' +
        renderStepDots('features') +
      '</div>' +
      '<div class="options-scroll-area">' +
        pillsHtml +
        '<div class="tiles-grid-2">' + tilesHtml + '</div>' +
      '</div>' +
      '<div class="screen-footer-wrap">' +
        '<div class="screen-footer">' +
          '<button type="button" class="prev-step-btn" data-action="nav-prev">Previous step</button>' +
          '<button type="button" class="btn-primary" data-action="nav-next">Continue</button>' +
        '</div>' +
      '</div>'
    );
  }

  // 7. Connect Your Tools (Step 5)
  function renderIntegrations() {
    const integrations = state.catalog.components.filter(function (c) {
      if (c.serviceId !== state.selectedServiceId || c.step !== 'Integrations') return false;
      if (!state.isStaff && c.visibleTo === 'Staff') return false;
      return true;
    });

    let tilesHtml = '';
    integrations.forEach(function (intg) {

      let sideLabel = '';

      else sideLabel = '<span class="tile-price">' + formatRupee(intg.rate) + '</span>';

      tilesHtml += (
        '<div class="tile ' + (isSelected || isLockedIncluded ? 'selected' : '') + ' ' + (isLockedIncluded ? 'is-included' : '') + '" ' + (isLockedIncluded ? 'aria-disabled="true"' : 'data-action="toggle-tile" data-comp-id="' + intg.id + '" tabindex="0" role="checkbox" aria-checked="' + isSelected + '"') + '>' +
          (isLockedIncluded ? '<span class="tile-pill-selected" style="background:#4B5563;">Included</span>' : '<span class="tile-pill-selected">Selected</span>') +
          '<div class="tile-content">' +
            '<div class="tile-title">' +
              escapeHtml(intg.name) +
              (intg.visibleTo === 'Staff' ? '<span class="staff-pill">Staff</span>' : '') +
            '</div>' +
            (intg.monthlyCost ? '<div class="tile-desc">Sub: ' + escapeHtml(intg.monthlyCost) + '</div>' : '') +
          '</div>' +
          '<div class="tile-side">' +
            sideLabel +
          '</div>' +
        '</div>'

    return (
      '<div class="screen-header-wrap">' +
        '<h2 class="screen-title">Connect your tools</h2>' +
        '<p class="screen-subtitle">Tool subscriptions are paid directly to the provider.</p>' +

      '</div>' +
      '<div class="options-scroll-area">' +
        '<div class="tiles-grid-2">' + tilesHtml + '</div>' +
      '</div>' +
      '<div class="screen-footer-wrap">' +
        '<div class="screen-footer">' +
          '<button type="button" class="prev-step-btn" data-action="nav-prev">Previous step</button>' +
          '<button type="button" class="btn-primary" data-action="nav-next">Review package</button>' +
        '</div>' +

  // 8. Review Your Package (Step 6)
  function renderSummary() {
    const res = state.quoteResult;
    const isStaff = state.isStaff;

    const groups = [
      { name: 'Base package', step: 'Base', jump: 'service', items: [] },
      { name: 'Catalogue', step: 'Catalogue', jump: 'catalogue', items: [] },
      { name: 'Pages', step: 'Pages', jump: 'pages', items: [] },
      { name: 'Features', step: 'Features', jump: 'features', items: [] },
      { name: 'Integrations', step: 'Integrations', jump: 'integrations', items: [] }
    ];

    if (isStaff && state.customLines.length) {
      groups.push({ name: 'Custom items', step: 'Custom', jump: 'summary', items: [] });
    }

    res.lines.forEach(function (l) {
      let grp = groups.find(function (g) { return g.step === l.step; });
      if (!grp && l.step === 'Custom') grp = groups[groups.length - 1];
      if (grp) grp.items.push(l);
    });

    let groupsHtml = '';
    groups.forEach(function (g) {
      if (g.items.length === 0) return;
      let itemsHtml = '';
      g.items.forEach(function (item) {
        let displayAmount = item.expectedAmount > 0 ? formatRupee(item.expectedAmount) : 'Included';
        if (isStaff && item.finalAmount !== item.expectedAmount && item.finalAmount !== undefined) {
          displayAmount = formatRupee(item.finalAmount) + ' <span style="font-size:11px;color:#9CA3AF;text-decoration:line-through;">' + formatRupee(item.expectedAmount) + '</span>';
        }

        let itemName = item.name;
        if (item.step === 'Catalogue' && item.chargeableQty > 0) {
          itemName = item.chargeableQty + ' extra ' + (item.componentId.indexOf('CAT') !== -1 ? 'categories' : 'products');
        }

        itemsHtml += (
          '<div class="summary-item-row">' +
            '<span class="summary-item-name">' + escapeHtml(itemName) + '</span>' +
            '<span class="summary-item-amount">' + displayAmount + '</span>' +
          '</div>'
        );
      });

      groupsHtml += (
        '<div class="summary-group">' +
          '<div class="summary-group-title-col">' +
            '<div class="summary-group-name">' +
              escapeHtml(g.name) +
              '<span class="summary-edit-link" data-action="jump-to-step" data-target="' + g.jump + '">Edit</span>' +
            '</div>' +
          '</div>' +
          '<div class="summary-group-items-col">' + itemsHtml + '</div>' +
        '</div>'
      );
    });

    // Staff custom lines list in scrolling area
    let staffCustomRowsHtml = '';
    if (isStaff) {
      let rows = '';
      state.customLines.forEach(function (cust, idx) {
        rows += (
          '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">' +
            '<input type="text" class="form-input" style="flex:2;" placeholder="Item name" value="' + escapeHtml(cust.name) + '" data-action="custom-field" data-custom-idx="' + idx + '" data-field="name">' +
            '<input type="number" class="form-input" style="flex:1;" placeholder="Amount ₹" value="' + cust.amount + '" data-action="custom-field" data-custom-idx="' + idx + '" data-field="amount">' +
            '<label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;">' +
              '<input type="checkbox" ' + (cust.discountable ? 'checked' : '') + ' data-action="custom-field" data-custom-idx="' + idx + '" data-field="discountable"> Disc.' +
            '</label>' +
            '<button type="button" class="btn-text-danger" style="color:#DC2626;font-size:12px;padding:4px 8px;background:none;border:none;cursor:pointer;font-weight:600;" data-action="remove-custom-line" data-custom-idx="' + idx + '">Remove</button>' +
          '</div>'
        );
      });

      staffCustomRowsHtml = (
        '<div style="margin-top:14px;">' +
          rows +
          '<button type="button" class="custom-line-dashed-btn" data-action="add-custom-line">+ Add custom line item</button>' +
        '</div>'
      );
    }

    // Quote on request note
    let quoteReqHtml = '';
    if (res.quoteOnRequestItems.length) {
      quoteReqHtml = (
        '<div class="info-callout" style="margin-top:12px;">' +
          '<span>Plus items priced after consultation: <strong>' + escapeHtml(res.quoteOnRequestItems.join(', ')) + '</strong></span>' +
        '</div>'
      );
    }

    // Staff Pricing Fixed Box directly above footer
    let staffPricingFixedHtml = '';
    if (isStaff) {
      const maxDisc = (state.catalog.settings.maxStaffDiscount || 0.15) * 100;
      const requiresReason = res.discountPct > maxDisc;

      staffPricingFixedHtml = (
        '<div class="staff-pricing-fixed">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
            '<span style="font-size:12.5px;font-weight:600;color:#111827;">Staff adjustments</span>' +
            '<div style="display:flex;align-items:center;gap:10px;">' +
              '<span style="font-size:12px;color:#6B7280;">Expected: <strong id="staff-expected-val">' + formatRupee(res.expectedPrice) + '</strong></span>' +
              '<div style="display:flex;align-items:center;gap:6px;">' +
                '<span style="font-size:12px;font-weight:600;">Final price:</span>' +
                '<input type="number" id="input-final-price" class="form-input" style="width:105px;padding:4px 8px;font-size:12.5px;" value="' + (state.finalPriceOverride !== null ? state.finalPriceOverride : res.expectedPrice) + '">' +
                '<span id="staff-disc-pill" class="tile-pill" style="background:#FEF3C7;color:#B45309;' + (res.discountPct > 0 ? '' : 'display:none;') + '">Discount ' + res.discountPct + '%</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          (requiresReason ?
            '<div class="form-group" style="margin-top:6px;margin-bottom:6px;">' +
              '<label class="form-label" style="color:#B45309;font-size:11px;">Reason for discount (required above ' + maxDisc + '%)</label>' +
              '<input type="text" id="input-discount-reason" class="form-input" style="padding:4px 8px;font-size:12px;" placeholder="e.g. Founder approval / annual package" value="' + escapeHtml(state.discountReason) + '">' +
            '</div>' : '') +
          '<div class="form-group" style="margin-top:4px;margin-bottom:0;">' +
            '<input type="text" id="input-staff-name" class="form-input" style="padding:4px 8px;font-size:12px;" placeholder="Your staff name" value="' + escapeHtml(state.staffName) + '">' +
          '</div>' +
        '</div>'
      );
    }

    const nextBtnText = isStaff ? 'Continue to client details' : 'Get my estimate';

    return (
      '<div class="screen-header-wrap">' +
        '<h2 class="screen-title">' + (isStaff ? 'Review and adjust' : 'Review your package') + '</h2>' +
        '<p class="screen-subtitle">A final look at what you\'re getting and the total cost.</p>' +
        renderStepDots('summary') +
      '</div>' +
      '<div class="options-scroll-area">' +
        '<div class="summary-items-list">' +
          groupsHtml +
        '</div>' +
        staffCustomRowsHtml +
        quoteReqHtml +
      '</div>' +
      '<div class="screen-footer-wrap">' +
        staffPricingFixedHtml +
        '<div class="summary-totals-fixed">' +
          '<div class="summary-total-row">' +
            '<span>Subtotal</span>' +
            '<span id="summary-subtotal">' + formatRupee(res.finalPrice) + '</span>' +
          '</div>' +
          '<div class="summary-total-row">' +
            '<span id="summary-gst-label">' + escapeHtml(res.taxType) + '</span>' +
            '<span id="summary-gst">' + formatRupeeExact(res.gstAmount) + '</span>' +
          '</div>' +
          '<div class="summary-total-row grand-total">' +
            '<span>Total</span>' +
            '<span id="summary-grand-total">' + formatRupeeExact(res.grandTotal) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="screen-footer">' +
          '<button type="button" class="prev-step-btn" data-action="nav-prev">Previous step</button>' +
          '<button type="button" class="btn-primary" data-action="nav-next">' + nextBtnText + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  // 10. Confirmation Screen
  function renderConfirmation() {
    const sub = state.submissionResult || {};
    const subId = sub.submissionId || 'AP-' + Date.now();
    const cl = state.client;

  // ==========================================================================
  // Stepper Controller & Repetitive Hold Logic
  // ==========================================================================

  function adjustStepperQty(cid, delta) {
    const comp = state.catalog.components.find(function (c) { return c.id === cid; });
    if (!comp) return;

    const stepAmt = comp.batchSize > 0 ? comp.batchSize : 1;
    const min = comp.minQty !== null && comp.minQty !== undefined ? comp.minQty : (comp.type === 'Optional + Qty' ? 1 : comp.includedQty);
    const max = comp.maxQty !== null && comp.maxQty !== undefined ? comp.maxQty : 1000;
    let cur = state.selections[cid] !== undefined ? state.selections[cid] : (comp.type === 'Optional + Qty' ? 1 : comp.includedQty);

    if (delta > 0) cur = Math.min(max, cur + stepAmt);
    else if (delta < 0) cur = Math.max(min, cur - stepAmt);

    state.selections[cid] = cur;
    updateStepperDOM(comp, cur, min, max);
    recalc();
  }

  function updateStepperDOM(comp, qty, min, max) {
    const container = document.querySelector('[data-comp-id="' + comp.id + '"]');
    if (!container) return;

    const input = container.querySelector('.stepper-input');
    if (input && input.value !== String(qty)) input.value = qty;

    const btnDec = container.querySelector('[data-action="qty-dec"]');
    const btnInc = container.querySelector('[data-action="qty-inc"]');
    if (btnDec) {
      btnDec.disabled = qty <= min;
      btnDec.setAttribute('aria-disabled', String(qty <= min));
    }
    if (btnInc) {
      btnInc.disabled = qty >= max;
      btnInc.setAttribute('aria-disabled', String(qty >= max));
    }

    const helperEl = document.getElementById('helper-' + comp.id);
    if (helperEl) {
      const extra = Math.max(0, qty - comp.includedQty);
      let helper = '';
      if (comp.batchSize > 0) {
        const batches = Math.ceil(extra / comp.batchSize);
        const extraCost = batches * comp.rate;
        helper = comp.includedQty + ' included · ' + extra + ' extra = ' + formatRupee(extraCost) + ' (' + formatRupee(comp.rate) + ' per ' + comp.batchSize + ' ' + (comp.unit || 'items') + ')';
      } else {
        const extraCost = extra * comp.rate;
        helper = comp.includedQty + ' included · ' + extra + ' extra × ' + formatRupee(comp.rate) + ' = ' + formatRupee(extraCost);
      }
      helperEl.textContent = helper;
    }
  }

  function startStepperHold(cid, delta) {
    stopStepperHold();
    adjustStepperQty(cid, delta);
    holdTimer = setTimeout(function () {
      repeatInterval = setInterval(function () {
        adjustStepperQty(cid, delta);
      }, 80);
    }, 400);
  }

  function stopStepperHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (repeatInterval) { clearInterval(repeatInterval); repeatInterval = null; }
  }

  // ==========================================================================
  // Tile Toggling & Tag Filtering (WITHOUT RE-RENDERING THE SCREEN)
  // ==========================================================================

  function toggleStandardTile(cid) {
    const comp = state.catalog.components.find(function (c) { return c.id === cid; });
    if (!comp || comp.type === 'Included') return;

    const isSelected = Boolean(state.selections[cid]);
    if (isSelected) {
      delete state.selections[cid];
    } else {
      state.selections[cid] = 1;
    }

    const tile = document.querySelector('.tile[data-comp-id="' + cid + '"]');
    if (tile) {
      tile.classList.toggle('selected', !isSelected);
      tile.setAttribute('aria-checked', String(!isSelected));
    }
    recalc();
  }

  function toggleOptQtyTile(cid) {
    const comp = state.catalog.components.find(function (c) { return c.id === cid; });
    if (!comp) return;

    const isSelected = Boolean(state.selections[cid]);
    const tileContainer = document.querySelector('.tile[data-comp-id="' + cid + '"]');

    if (isSelected) {
      delete state.selections[cid];
      if (tileContainer) {
        tileContainer.classList.remove('selected');
        const mainBtn = tileContainer.querySelector('.tile-main-btn');
        if (mainBtn) mainBtn.setAttribute('aria-checked', 'false');
        const row = tileContainer.querySelector('.tile-stepper-row');
        if (row) row.style.display = 'none';
      }
    } else {
      state.selections[cid] = 1;
      if (tileContainer) {
        tileContainer.classList.add('selected');
        const mainBtn = tileContainer.querySelector('.tile-main-btn');
        if (mainBtn) mainBtn.setAttribute('aria-checked', 'true');
        const row = tileContainer.querySelector('.tile-stepper-row');
        if (row) row.style.display = 'flex';
        const inp = tileContainer.querySelector('.stepper-input');
        if (inp) inp.value = '1';
      }
    }
    recalc();
  }

  function filterFeatureTag(tag) {
    state.featureTagFilter = tag;
    const pills = document.querySelectorAll('.filter-pill');
    pills.forEach(function (p) {
      p.classList.toggle('active', p.getAttribute('data-tag') === tag);
    });

    const tiles = document.querySelectorAll('.tiles-grid-2 .tile[data-tag]');
    tiles.forEach(function (tile) {
      const tileTag = tile.getAttribute('data-tag');
      if (tag === 'All' || tileTag === tag) {
        tile.style.display = '';
      } else {
        tile.style.display = 'none';
      }
    });
  }

  function selectService(sid) {
    state.selectedServiceId = sid;
    const tiles = document.querySelectorAll('[data-service-id]');
    tiles.forEach(function (t) {
      const isSel = t.getAttribute('data-service-id') === sid;
      t.classList.toggle('selected', isSel);
      t.setAttribute('aria-checked', String(isSel));
    });
    recalc();
  }

  // ==========================================================================
  // Form Field Validation & Submission
  // ==========================================================================

  function clearFieldError(field) {
    if (state.fieldErrors[field]) {
      delete state.fieldErrors[field];
      const errEl = document.getElementById('err-' + field);
      if (errEl) {
        errEl.textContent = '';
        errEl.style.display = 'none';
      }
      const inp = document.querySelector('[data-field="' + field + '"]');
      if (inp) inp.classList.remove('input-error');
    }
  }

  function validateField(field) {
    let err = '';
    const val = (state.client[field] || '').trim();

    if (field === 'name') {
      if (!val) err = 'Please enter your name.';
    } else if (field === 'mobile') {
      const mobilePattern = /^[6-9][0-9]{9}$/;
      if (!mobilePattern.test(val)) err = 'Enter a valid 10-digit mobile number starting with 6-9.';
    } else if (field === 'email') {
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
      if (!emailPattern.test(val)) err = 'Enter a valid email address.';
    } else if (field === 'gstin' && val) {
      const gstinPattern = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
      if (!gstinPattern.test(val)) err = 'Enter a valid 15-character GSTIN.';
    }

    const errEl = document.getElementById('err-' + field);
    const inp = document.querySelector('[data-field="' + field + '"]');
    if (err) {
      state.fieldErrors[field] = err;
      if (errEl) {
        errEl.textContent = err;
        errEl.style.display = 'block';
      }
      if (inp) inp.classList.add('input-error');
    } else {
      clearFieldError(field);
    }
    return !err;
  }

  function handleSubmitForm() {
    const honeypot = (document.getElementById('field-honeypot') || {}).value;
    if (honeypot) {
      console.warn('Bot detected via honeypot.');
      return;
    }

    const v1 = validateField('name');
    const v2 = validateField('mobile');
    const v3 = validateField('email');
    const v4 = validateField('gstin');

    if (!v1 || !v2 || !v3 || !v4) {
      showToast('Please fix the errors highlighted below.', true);
      return;
    }

    const selections = [];
    Object.keys(state.selections).forEach(function (cid) {
      const q = state.selections[cid];
      if (q > 0) selections.push({ componentId: cid, qty: q });
    });

    const payload = {
      serviceId: state.selectedServiceId,
      selections: selections,
      customLines: state.isStaff ? state.customLines : [],
      finalPriceOverride: state.isStaff ? state.finalPriceOverride : null,
      discountReason: state.discountReason,
      staffName: state.staffName,
      client: state.client,
      honeypot: ''
    };

    state.isSubmitting = true;
    renderApp();

    callServer('saveSubmission', payload, state.staffToken)
      .then(function (result) {
        state.isSubmitting = false;
        state.submissionResult = result;
        try {
          window.top.postMessage({
            source: 'adspeek-estimate',
            action: 'submitted',
            submissionId: result.submissionId
          }, '*');
        } catch (e) {}
        navigate('confirmation');
      })
      .catch(function (err) {
        state.isSubmitting = false;
        renderApp();
        showToast(err.message || 'Submission failed. Please try again.', true);
      });
  }

  // --- Estimate Breakdown Sheet Renderer ---
  function updateBreakdownSheet() {
    const listEl = document.getElementById('breakdown-list-content');
    if (!listEl) return;
    const res = state.quoteResult || { basePrice: 0, expectedPrice: 0, grandTotal: 0, lines: [] };
    const baseAmt = res.basePrice || 0;
    const subtotal = res.finalPrice !== undefined && res.finalPrice !== null ? res.finalPrice : res.expectedPrice;
    const addOns = Math.max(0, subtotal - baseAmt);
    const gstAmt = Math.round(subtotal * 0.18);
    const total = subtotal + gstAmt;

    listEl.innerHTML = (
      '<div class="breakdown-row"><span>Base package</span><span>' + formatRupee(baseAmt) + '</span></div>' +
      '<div class="breakdown-row"><span>Add-ons</span><span>' + formatRupee(addOns) + '</span></div>' +
      '<div class="breakdown-row breakdown-subtotal"><span>Subtotal (excl. GST)</span><span>' + formatRupee(subtotal) + '</span></div>' +
      '<div class="breakdown-row"><span>GST (18%)</span><span>' + formatRupee(gstAmt) + '</span></div>' +
      '<div class="breakdown-row breakdown-grand-total"><span>Total</span><span>' + formatRupee(total) + '</span></div>'
    );
  }

  // --- Virtual Keyboard & Viewport Handler (Section 4) ---
  function setupKeyboardHandling() {
    if (window.visualViewport) {
      const initialHeight = window.visualViewport.height;
      window.visualViewport.addEventListener('resize', function () {
        const isKeyboard = window.visualViewport.height < initialHeight - 120;
        document.body.classList.toggle('keyboard-open', isKeyboard);
      });
    }

    document.addEventListener('focusin', function (e) {
      if (e.target.matches('input, select, textarea')) {
        setTimeout(function () {
          e.target.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }, 120);
      }
    });
  }

  function setupGlobalEventDelegation() {
    const root = document.getElementById('app-root') || document.body;

    // 1. Pointer Down / Up / Leave for Steppers
    document.addEventListener('pointerdown', function (e) {
      const btn = e.target.closest('.stepper-btn[data-action]');
      if (!btn || btn.disabled) return;
      const act = btn.getAttribute('data-action');
      const cid = btn.getAttribute('data-comp-id');
      if (!cid) return;

      const delta = act === 'qty-inc' ? 1 : -1;
      startStepperHold(cid, delta);
    });

    document.addEventListener('pointerup', stopStepperHold);
    document.addEventListener('pointercancel', stopStepperHold);
    document.addEventListener('pointerleave', stopStepperHold);

    // 2. Click Routing via data-action
    document.addEventListener('click', function (e) {
      const target = e.target.closest('[data-action]');
      if (!target) return;

      const action = target.getAttribute('data-action');

      // Prevent stepper click duplicate firing after pointerdown
      if (action === 'qty-inc' || action === 'qty-dec') {
        e.preventDefault();
        return;
      }

      if (action === 'close') {
        requestClose();
      } else if (action === 'toggle-breakdown') {
        const sheet = document.getElementById('breakdown-sheet');
        if (sheet) {
          const isHidden = sheet.hidden;
          sheet.hidden = !isHidden;
          if (!sheet.hidden) updateBreakdownSheet();
        }
      } else if (action === 'cancel-leave') {
        const modal = document.getElementById('leave-confirm-modal');
        if (modal) modal.hidden = true;
      } else if (action === 'confirm-leave') {
        doClose();
      } else if (action === 'set-role') {
        const role = target.getAttribute('data-role');
        state.role = role;
        renderApp();
      } else if (action === 'welcome-continue') {
        if (state.role === 'staff' && !state.isStaff) {
          navigate('staff_login');
        } else {
          navigate('service');
        }
      } else if (action === 'toggle-password') {
        const pwInp = document.getElementById('staff-pw-input');
        if (pwInp) {
          const isPw = pwInp.type === 'password';
          pwInp.type = isPw ? 'text' : 'password';
          target.textContent = isPw ? 'Hide' : 'Show';
        }
      } else if (action === 'staff-login') {
        const pwInp = document.getElementById('staff-pw-input');
        const errEl = document.getElementById('staff-login-error');
        const pw = pwInp ? pwInp.value.trim() : '';
        if (!pw) {
          if (errEl) { errEl.textContent = 'Please enter password.'; errEl.style.display = 'block'; }
          return;
        }
        target.disabled = true;
        target.textContent = 'Verifying…';
        if (errEl) errEl.style.display = 'none';

        callServer('staffLogin', pw)
          .then(function (res) {
            state.staffToken = res.token;
            state.isStaff = true;
            return callServer('getCatalog', res.token);
          })
          .then(function (newCat) {
            state.catalog = newCat;
            navigate('service');
          })
          .catch(function (err) {
            if (errEl) {
              errEl.textContent = err.message || 'Incorrect password.';
              errEl.style.display = 'block';
            }
            target.disabled = false;
            target.textContent = 'Log in';
          });
      } else if (action === 'staff-logout') {
        if (state.staffToken) {
          callServer('staffLogout', state.staffToken).catch(function () {});
        }
        state.isStaff = false;
        state.staffToken = null;
        state.role = 'client';
        state.customLines = [];
        state.finalPriceOverride = null;
        callServer('getCatalog', null).then(function (cat) {
          state.catalog = cat;
          navigate('welcome');
        });
      } else if (action === 'select-service') {
        const sid = target.getAttribute('data-service-id');
        selectService(sid);
      } else if (action === 'toggle-tile') {
        const cid = target.getAttribute('data-comp-id');
        toggleStandardTile(cid);
      } else if (action === 'toggle-opt-qty') {
        const cid = target.getAttribute('data-comp-id');
        toggleOptQtyTile(cid);
      } else if (action === 'filter-tag') {
        const tag = target.getAttribute('data-tag');
        filterFeatureTag(tag);
      } else if (action === 'nav-screen') {
        const screen = target.getAttribute('data-target');
        navigate(screen);
      } else if (action === 'nav-prev') {
        const sc = state.currentScreen;
        if (sc === 'service') navigate('welcome');
        else if (sc === 'catalogue') navigate('service');
        else if (sc === 'pages') navigate('catalogue');
        else if (sc === 'features') navigate('pages');
        else if (sc === 'integrations') navigate('features');
        else if (sc === 'summary') navigate('integrations');
        else if (sc === 'details') navigate('summary');
        else if (sc === 'staff_login') navigate('welcome');
      } else if (action === 'nav-next' || action === 'mobile-next') {
        const sc = state.currentScreen;
        if (sc === 'service') navigate('catalogue');
        else if (sc === 'catalogue') navigate('pages');
        else if (sc === 'pages') navigate('features');
        else if (sc === 'features') navigate('integrations');
        else if (sc === 'integrations') navigate('summary');
        else if (sc === 'summary') {
          if (state.isStaff) {
            const maxDisc = (state.catalog.settings.maxStaffDiscount || 0.15) * 100;
            if (state.quoteResult && state.quoteResult.discountPct > maxDisc && !state.discountReason.trim()) {
              showToast('Please enter a reason for discount above ' + maxDisc + '%.', true);
              return;
            }
          }
          navigate('details');
        } else if (sc === 'details') {
          handleSubmitForm();
        }
      } else if (action === 'jump-to-step') {
        const targetStep = target.getAttribute('data-target');
        navigate(targetStep);
      } else if (action === 'add-custom-line') {
        state.customLines.push({
          name: 'Custom service ' + (state.customLines.length + 1),
          amount: 1000,
          discountable: true
        });
        recalc();
        renderApp();
      } else if (action === 'remove-custom-line') {
        const idx = parseInt(target.getAttribute('data-custom-idx'), 10);
        state.customLines.splice(idx, 1);
        recalc();
        renderApp();
      } else if (action === 'submit-form') {
        handleSubmitForm();
      } else if (action === 'build-another') {
        state.selections = {};
        state.customLines = [];
        state.finalPriceOverride = null;
        state.discountReason = '';
        state.client = {
          name: '',
          businessName: '',
          mobile: '',
          email: '',
          gstin: '',
          stateCode: '',
          address: '',
          whatsappOptIn: true
        };
        state.fieldErrors = {};
        state.submissionResult = null;
        navigate('service');
      }
    });

    // 3. Typing in Stepper Inputs (debounced 150ms price update, no clamp while typing)
    document.addEventListener('input', function (e) {
      const target = e.target;

      if (target.classList.contains('stepper-input')) {
        target.value = target.value.replace(/\D/g, ''); // Digits only
        const cid = target.getAttribute('data-comp-id');
        clearTimeout(stepperDebounceTimer);
        stepperDebounceTimer = setTimeout(function () {
          const val = parseInt(target.value, 10);
          if (!isNaN(val)) {
            state.selections[cid] = val;
            recalc();
          }
        }, 150);
      } else if (target.hasAttribute('data-field')) {
        const field = target.getAttribute('data-field');
        let val = target.value;

        if (field === 'mobile') {
          val = val.replace(/\D/g, '').slice(0, 10);
          target.value = val;
        } else if (field === 'gstin') {
          val = val.toUpperCase().slice(0, 15);
          target.value = val;
          if (val.length >= 2) {
            const sc = stateCodeFromGstin(val);
            if (sc) {
              state.client.stateCode = sc;
              const selState = document.getElementById('field-state');
              if (selState) selState.value = sc;
            }
          }
        }

        state.client[field] = val;
        clearFieldError(field);
        recalc();
      } else if (target.id === 'input-final-price') {
        const v = target.value.trim();
        state.finalPriceOverride = v !== '' ? Number(v) : null;
        recalc();
      } else if (target.id === 'input-discount-reason') {
        state.discountReason = target.value;
      } else if (target.id === 'input-staff-name') {
        state.staffName = target.value;
      } else if (target.getAttribute('data-action') === 'custom-field') {
        const idx = parseInt(target.getAttribute('data-custom-idx'), 10);
        const fld = target.getAttribute('data-field');
        if (state.customLines[idx]) {
          if (fld === 'name') state.customLines[idx].name = target.value;
          else if (fld === 'amount') state.customLines[idx].amount = Number(target.value) || 0;
          else if (fld === 'discountable') state.customLines[idx].discountable = target.checked;
          recalc();
        }
      }
    });

    // 4. Blur Handling (Clamping steppers, validating fields)
    document.addEventListener('blur', function (e) {
      const target = e.target;

      if (target.classList.contains('stepper-input')) {
        const cid = target.getAttribute('data-comp-id');
        const comp = state.catalog.components.find(function (c) { return c.id === cid; });
        if (!comp) return;

        let val = parseInt(target.value, 10);
        const min = comp.minQty !== null && comp.minQty !== undefined ? comp.minQty : (comp.type === 'Optional + Qty' ? 1 : comp.includedQty);
        const max = comp.maxQty !== null && comp.maxQty !== undefined ? comp.maxQty : 1000;

        if (isNaN(val) || val < min) val = min;
        if (val > max) val = max;

        target.value = String(val);
        state.selections[cid] = val;
        updateStepperDOM(comp, val, min, max);
        recalc();
      } else if (target.hasAttribute('data-field')) {
        const field = target.getAttribute('data-field');
        if (field === 'name' || field === 'mobile' || field === 'email' || field === 'gstin') {
          validateField(field);
        }
      }
    }, true);

    // 5. Checkbox toggle on Details screen
    document.addEventListener('change', function (e) {
      if (e.target.id === 'field-whatsapp') {
        state.client.whatsappOptIn = e.target.checked;
      } else if (e.target.id === 'field-state') {
        state.client.stateCode = e.target.value;
        recalc();
      }
    });

    // 6. Keyboard accessibility & shortcuts
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        const modal = document.getElementById('leave-confirm-modal');
        if (modal && !modal.hidden) {
          modal.hidden = true;
        } else {
          requestClose();
        }
      } else if (e.key === 'Enter') {
        if (e.target.id === 'staff-pw-input') {
          const loginBtn = document.querySelector('[data-action="staff-login"]');
          if (loginBtn) loginBtn.click();
        } else if (e.target.classList.contains('stepper-input')) {
          e.target.blur();
        }
      } else if (e.key === ' ' || e.key === 'Enter') {
        const tile = e.target.closest('.tile');
        if (tile && !e.target.closest('button') && !e.target.closest('input')) {
          e.preventDefault();
          const compId = tile.getAttribute('data-comp-id');
          if (compId) toggleStandardTile(compId);
        }
      }
    });

    // 7. Mobile keyboard visual viewport accommodation
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        const bottomBar = document.querySelector('.mobile-bottom-bar');
        if (!bottomBar) return;
        const isKeyboardOpen = window.visualViewport.height < window.innerHeight * 0.75;
        bottomBar.style.display = isKeyboardOpen ? 'none' : '';
      });
    }

    // 8. Host window communication (close requested by host backdrop / Esc)
    window.addEventListener('message', function (event) {
      const data = event.data;
      if (!data || data.source !== 'adspeek-estimate-host') return;
      if (data.action === 'request-close') {
        requestClose();
      }
    });
  }

  // --- Initialization ---
  function init() {
    setupGlobalEventDelegation();
    setupKeyboardHandling();

    callServer('getCatalog', null)
      .then(function (cat) {
        state.catalog = cat;
        recalc();
        renderApp();
      })
      .catch(function (err) {
        const root = document.getElementById('app-root');
        if (root) {
          root.innerHTML = (
            '<div style="padding:40px;text-align:center;">' +
              '<h3 style="color:#DC2626;margin-bottom:8px;">Failed to load package options</h3>' +
              '<p style="color:#6B7280;margin-bottom:16px;">' + escapeHtml(err.message) + '</p>' +
              '<button type="button" class="btn-primary" onclick="window.location.reload()">Try again</button>' +
            '</div>'
          );
        }
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
