  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)

      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  function formatRupee(n) {

      currency: 'INR',
      maximumFractionDigits: 0

  }

  function formatRupeeExact(n) {

      style: 'currency',
      currency: 'INR',
      minimumFractionDigits: 2,

    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast';
      toast.className = 'toast-msg';
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.style.background = isError ? '#DC2626' : '#111827';
    toast.classList.add('show');
    setTimeout(function () {
      toast.classList.remove('show');
    }, 3500);
  }

  // --- Recalculate Quote ---
  function recalc() {
    if (!state.catalog) return;

    // Build selections array
    const selections = [];
    Object.keys(state.selections).forEach(function (cid) {
      const q = state.selections[cid];
      if (q > 0) {
        selections.push({ componentId: cid, qty: q });
      }
    });

    const payload = {
      serviceId: state.selectedServiceId,
      selections: selections,
      customLines: state.customLines,
      finalPriceOverride: state.finalPriceOverride,
      client: state.client
    };

    state.quoteResult = computeQuote(state.catalog, payload, state.isStaff);
    updateLeftPanelPrice();
  }

  // --- Left Panel Price & Details Update ---
  function updateLeftPanelPrice() {
    const priceEl = document.getElementById('lp-price-val');
    const noteEl = document.getElementById('lp-price-note');
    const mobilePriceEl = document.getElementById('mobile-estimate-price');
    if (!priceEl || !state.quoteResult) return;

    const res = state.quoteResult;
    let formatted = '';
    let note = '';

    if (state.currentScreen === 'welcome') {
      formatted = '₹0';
      note = '';
    } else if (state.currentScreen === 'service') {
      formatted = formatRupee(res.basePrice);
      note = 'Base package · GST extra';
    } else if (state.currentScreen === 'catalogue') {
      formatted = formatRupee(res.expectedPrice);
      const extraCatalogue = res.expectedPrice - res.basePrice;
      note = extraCatalogue > 0 ? '+' + formatRupee(extraCatalogue) + ' for extra products and categories' : 'Included in base package';
    } else if (state.currentScreen === 'features') {
      formatted = formatRupee(res.expectedPrice);
      let featCount = 0;
      state.catalog.components.forEach(function (c) {
        if (c.step === 'Features' && state.selections[c.id] > 0) featCount++;
      });
      note = featCount > 0 ? featCount + ' feature' + (featCount > 1 ? 's' : '') + ' added' : 'Optional upgrades';
    } else if (state.currentScreen === 'integrations') {
      formatted = formatRupee(res.expectedPrice);
      note = 'Setup charges only';
    } else if (state.currentScreen === 'summary' || state.currentScreen === 'details' || state.currentScreen === 'confirmation') {
      formatted = formatRupeeExact(res.grandTotal);
      note = 'Including GST';
    } else {
      formatted = formatRupee(res.expectedPrice);
      note = 'GST extra';
    }

    if (priceEl.textContent !== formatted) {
      priceEl.textContent = formatted;
      priceEl.classList.remove('price-pulse');
      void priceEl.offsetWidth; // trigger reflow
      priceEl.classList.add('price-pulse');
    }
    if (noteEl) noteEl.textContent = note;
    if (mobilePriceEl) mobilePriceEl.textContent = formatted;
  }

  // --- Screen Navigation ---
  function navigate(screenName) {
    state.currentScreen = screenName;
    recalc();
    renderApp();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // --- Step Dots Component ---
  function renderStepDots(activeScreenName) {
    const currentIndex = STEP_FLOW.indexOf(activeScreenName);
    if (currentIndex === -1) return '';

    const totalSteps = STEP_FLOW.length;
    const progressPct = (currentIndex / (totalSteps - 1)) * 100;

    let dotsHtml = '';
    for (let i = 0; i < totalSteps; i++) {
      let cls = 'step-dot';
      if (i === currentIndex) cls += ' active';
      else if (i < currentIndex) cls += ' completed';
      dotsHtml += '<div class="' + cls + '" data-step-index="' + i + '"></div>';
    }

    return (
      '<div class="step-dots-container">' +
        '<div class="step-dots-line"></div>' +
        '<div class="step-dots-progress" style="width: ' + progressPct + '%;"></div>' +
        '<div class="step-dots-wrapper">' + dotsHtml + '</div>' +
      '</div>'
    );
  }

    const integrations = state.catalog.components.filter(function (c) {

      if (!state.isStaff && c.visibleTo === 'Staff') return false;
      return true;
    });

    let tilesHtml = '';
    integrations.forEach(function (intg) {
      const isSelected = Boolean(state.selections[intg.id]);
      const isLockedIncluded = intg.type === 'Included';
      const isQuoteOnReq = intg.type === 'Quote on request';

      let icon = ICONS.code;
      if (intg.name.toLowerCase().indexOf('gst') !== -1) icon = ICONS.fileText;
      else if (intg.name.toLowerCase().indexOf('analytics') !== -1) icon = ICONS.barChart;
      else if (intg.name.toLowerCase().indexOf('whatsapp') !== -1) icon = ICONS.messageSquare;
      else if (intg.name.toLowerCase().indexOf('tally') !== -1) icon = ICONS.refreshCw;
      else if (intg.name.toLowerCase().indexOf('cod') !== -1) icon = ICONS.shieldCheck;
      else if (intg.name.toLowerCase().indexOf('return') !== -1) icon = ICONS.rotateCcw;
      else if (intg.name.toLowerCase().indexOf('amazon') !== -1 || intg.name.toLowerCase().indexOf('sync') !== -1) icon = ICONS.layers;

      let sideHtml = '';
      if (isLockedIncluded) {
        sideHtml = '<span class="tile-pill">Included</span>';
      } else if (isQuoteOnReq) {
        sideHtml = '<span class="tile-pill">Price on request</span>';
      } else {
        sideHtml = '<span class="tile-price">' + formatRupee(intg.rate) + '</span>';
      }

      tilesHtml += (
        '<div class="tile ' + (isSelected || isLockedIncluded ? 'selected' : '') + ' ' + (isLockedIncluded ? 'disabled' : '') + '" data-comp-id="' + intg.id + '" tabindex="0" role="checkbox" aria-checked="' + (isSelected || isLockedIncluded) + '">' +
          '<div class="tile-check-badge">' + ICONS.checkSmall + '</div>' +
          '<div class="tile-icon-box">' + icon + '</div>' +
          '<div class="tile-content">' +
            '<div class="tile-title">' + escapeHtml(intg.name) + '</div>' +
            (intg.monthlyCost ? '<div class="tile-desc">' + escapeHtml(intg.monthlyCost) + '</div>' : '') +
          '</div>' +
          '<div class="tile-side">' + sideHtml + '</div>' +
        '</div>'
      );
    });

    return (
      '<div class="screen-header">' +
        '<h2 class="screen-title">Connect your tools</h2>' +
        '<p class="screen-subtitle">WhatsApp chat button is already included</p>' +
      '</div>' +
      renderStepDots('integrations') +
      '<div class="tiles-grid-2">' + tilesHtml + '</div>' +
      '<div class="screen-footer">' +
        '<button class="prev-step-btn" id="btn-integrations-prev">Previous step</button>' +
        '<button class="btn-primary" id="btn-integrations-next">Review package</button>' +
      '</div>'
    );
  }

  // 8. Review Package (Step 6 - Client & Staff)
  function renderSummary() {
    const res = state.quoteResult;
    const isStaff = state.isStaff;

    // Group items by step
    const groups = [
      { name: 'Base package', step: 'Base', jump: 'service', items: [] },
      { name: 'Catalogue', step: 'Catalogue', jump: 'catalogue', items: [] },
      { name: 'Pages', step: 'Pages', jump: 'pages', items: [] },
      { name: 'Features', step: 'Features', jump: 'features', items: [] },
      { name: 'Integrations', step: 'Integrations', jump: 'integrations', items: [] }

    if (isStaff && state.customLines.length) {
      groups.push({ name: 'Custom items', step: 'Custom', jump: 'summary', items: [] });
    }

    res.lines.forEach(function (l) {
      let grp = groups.find(function (g) { return g.step === l.step; });
      if (!grp && l.step === 'Custom') {
        grp = groups[groups.length - 1];
      }
      if (grp) {
        grp.items.push(l);
      }
    });

    let groupsHtml = '';
    groups.forEach(function (g) {
      if (g.items.length === 0) return;
      let itemsHtml = '';
      g.items.forEach(function (item) {
        let displayAmount = item.expectedAmount > 0 ? formatRupee(item.expectedAmount) : 'Included';
        if (isStaff && item.finalAmount !== item.expectedAmount && item.finalAmount !== undefined) {
          displayAmount = formatRupee(item.finalAmount) + ' <span style="font-size:11px;color:#9CA3AF;text-decoration:line-through;">' + formatRupee(item.expectedAmount) + '</span>';
        }

        let itemName = item.name;
        if (item.step === 'Catalogue' && item.chargeableQty > 0) {

        itemsHtml += (
          '<div class="summary-item-row">' +

      });

      const requiresReason = res.discountPct > maxDisc;

      staffAdjustHtml = (
        '<button type="button" class="custom-line-dashed-btn" id="btn-add-custom-line">+ Add custom line item</button>' +

            '<span>' + escapeHtml(res.taxType) + '</span>' +

            '<span>' + formatRupeeExact(res.grandTotal) + '</span>' +

        '</div>' +
      '</div>' +
      quoteReqHtml +
      '<div class="screen-footer">' +
        '<button class="prev-step-btn" id="btn-summary-prev">Previous step</button>' +
        '<button class="btn-primary" id="btn-summary-next">' + nextBtnText + '</button>' +

    );
  }

  // --- Main Application Shell Renderer ---
  function renderApp() {
    const root = document.getElementById('app-root');
    if (!root) return;

    if (!state.catalog) {
      root.innerHTML =
        '<div class="split-card" style="padding:60px;align-items:center;justify-content:center;min-height:500px;">' +
          '<div style="text-align:center;">' +
            '<div class="brand-logo-sq" style="margin:0 auto 16px auto;">AP</div>' +
            '<div style="font-size:16px;font-weight:600;margin-bottom:8px;">Loading package options…</div>' +
            '<div class="skeleton-box" style="width:240px;height:12px;margin:0 auto;"></div>' +
          '</div>' +
        '</div>';
      return;
    }

    // Top staff banner
    let staffBannerHtml = '';
    if (state.isStaff) {
      staffBannerHtml = (
        '<div class="staff-strip">' +
          '<span>Staff mode</span>' +
          '<button type="button" class="logout-btn" id="btn-staff-logout">Log out</button>' +
        '</div>'
      );
    }

    // Right panel content based on screen
    let rightContentHtml = '';
    const sc = state.currentScreen;
    if (sc === 'welcome') rightContentHtml = renderWelcome();
    else if (sc === 'staff_login') rightContentHtml = renderStaffLogin();
    else if (sc === 'service') rightContentHtml = renderService();
    else if (sc === 'catalogue') rightContentHtml = renderCatalogue();
    else if (sc === 'pages') rightContentHtml = renderPages();
    else if (sc === 'features') rightContentHtml = renderFeatures();
    else if (sc === 'integrations') rightContentHtml = renderIntegrations();
    else if (sc === 'summary') rightContentHtml = renderSummary();
    else if (sc === 'details') rightContentHtml = renderDetails();
    else if (sc === 'confirmation') rightContentHtml = renderConfirmation();

    // Mobile sticky bottom bar
    let mobileBarHtml = '';
    if (sc !== 'welcome' && sc !== 'staff_login' && sc !== 'confirmation') {
      let mobileBtnLabel = 'Continue';
      if (sc === 'integrations') mobileBtnLabel = 'Review package';
      else if (sc === 'summary') mobileBtnLabel = state.isStaff ? 'Continue' : 'Get estimate';
      else if (sc === 'details') mobileBtnLabel = state.isStaff ? 'Save quote' : 'Send estimate';

      mobileBarHtml = (
        '<div class="mobile-sticky-bar">' +
          '<div>' +
            '<div class="mobile-estimate-label">Your estimate</div>' +
            '<div class="mobile-estimate-val" id="mobile-estimate-price">₹0</div>' +
          '</div>' +
          '<button class="btn-primary" id="mobile-btn-action">' + mobileBtnLabel + '</button>' +
        '</div>'
      );
    }

    root.innerHTML =
      staffBannerHtml +
      '<div class="split-card">' +
        renderLeftPanel() +
        '<div class="right-panel">' + rightContentHtml + '</div>' +
      '</div>' +
      mobileBarHtml;

    updateLeftPanelPrice();
    attachEventListeners();
  }

  // ==========================================================================
  // Event Delegation & Interactions
  // ==========================================================================
  function attachEventListeners() {
    const root = document.getElementById('app-root');
    if (!root) return;

    // Staff logout
    const logoutBtn = document.getElementById('btn-staff-logout');
    if (logoutBtn) {
      logoutBtn.onclick = function () {
        if (state.staffToken) {
          callServer('staffLogout', state.staffToken).catch(function () {});
        }
        state.isStaff = false;
        state.staffToken = null;
        state.role = 'client';
        state.customLines = [];
        state.finalPriceOverride = null;
        // Reload public catalog
        callServer('getCatalog', null).then(function (cat) {
          state.catalog = cat;
          navigate('welcome');
        });
      };
    }

    // 1. Welcome Screen Actions
    const roleClient = document.getElementById('tile-role-client');
    const roleStaff = document.getElementById('tile-role-staff');
    if (roleClient) {
      roleClient.onclick = function () {
        state.role = 'client';
        renderApp();
      };
    }
    if (roleStaff) {
      roleStaff.onclick = function () {
        state.role = 'staff';
        renderApp();
      };
    }
    const welcomeContinue = document.getElementById('btn-welcome-continue');
    if (welcomeContinue) {
      welcomeContinue.onclick = function () {
        if (state.role === 'staff' && !state.isStaff) {
          navigate('staff_login');
        } else {
          navigate('service');
        }
      };
    }

    // 2. Staff Login Actions
    const staffPwInput = document.getElementById('staff-pw-input');
    const staffLoginBtn = document.getElementById('btn-staff-login');
    const pwToggleBtn = document.getElementById('pw-toggle-btn');
    const staffBackBtn = document.getElementById('btn-staff-back');

    if (pwToggleBtn && staffPwInput) {
      pwToggleBtn.onclick = function () {
        const isPw = staffPwInput.type === 'password';
        staffPwInput.type = isPw ? 'text' : 'password';
        pwToggleBtn.innerHTML = isPw ? ICONS.eyeOff : ICONS.eye;
      };
    }
    if (staffBackBtn) {
      staffBackBtn.onclick = function () {
        navigate('welcome');
      };
    }
    if (staffLoginBtn && staffPwInput) {
      const doLogin = function () {
        const pw = staffPwInput.value.trim();
        const errEl = document.getElementById('staff-login-error');
        if (!pw) {
          errEl.textContent = 'Please enter password.';
          errEl.style.display = 'block';
          return;
        }
        staffLoginBtn.disabled = true;
        staffLoginBtn.textContent = 'Verifying…';
        errEl.style.display = 'none';

        callServer('staffLogin', pw)
          .then(function (res) {
            state.staffToken = res.token;
            state.isStaff = true;
            return callServer('getCatalog', res.token);
          })
          .then(function (newCat) {
            state.catalog = newCat;
            navigate('service');
          })
          .catch(function (err) {
            errEl.textContent = err.message || 'Incorrect password.';
            errEl.style.display = 'block';
            staffLoginBtn.disabled = false;
            staffLoginBtn.textContent = 'Log in';
          });
      };
      staffLoginBtn.onclick = doLogin;
      staffPwInput.onkeydown = function (e) {
        if (e.key === 'Enter') doLogin();
      };
    }

    // 3. Service Screen Actions
    const serviceTiles = root.querySelectorAll('[data-service-id]');
    serviceTiles.forEach(function (tile) {
      tile.onclick = function () {
        const sid = tile.getAttribute('data-service-id');
        state.selectedServiceId = sid;
        recalc();
        renderApp();
      };
    });
    const svcPrev = document.getElementById('btn-service-prev');
    const svcNext = document.getElementById('btn-service-next');
    if (svcPrev) svcPrev.onclick = function () { navigate('welcome'); };
    if (svcNext) svcNext.onclick = function () { navigate('catalogue'); };

    // 4. Catalogue Screen Actions
    const stepperBtns = root.querySelectorAll('[data-stepper-act]');
    stepperBtns.forEach(function (btn) {
      btn.onclick = function () {
        const act = btn.getAttribute('data-stepper-act');
        const cid = btn.getAttribute('data-comp-id');
        const comp = state.catalog.components.find(function (c) { return c.id === cid; });
        if (!comp) return;

        let cur = state.selections[cid] !== undefined ? state.selections[cid] : comp.includedQty;
        const stepAmt = comp.batchSize > 0 ? comp.batchSize : 1;
        const min = comp.minQty !== null ? comp.minQty : comp.includedQty;
        const max = comp.maxQty !== null ? comp.maxQty : 1000;

        if (act === 'inc') cur = Math.min(max, cur + stepAmt);
        else if (act === 'dec') cur = Math.max(min, cur - stepAmt);

        state.selections[cid] = cur;
        recalc();
        renderApp();
      };
    });
    const stepperInputs = root.querySelectorAll('.stepper-input');
    stepperInputs.forEach(function (inp) {
      inp.onchange = function () {
        const cid = inp.getAttribute('data-comp-id');
        const comp = state.catalog.components.find(function (c) { return c.id === cid; });
        if (!comp) return;

        let val = parseInt(inp.value, 10);
        const min = comp.minQty !== null ? comp.minQty : comp.includedQty;
        const max = comp.maxQty !== null ? comp.maxQty : 1000;
        if (isNaN(val) || val < min) val = min;
        if (val > max) val = max;

        state.selections[cid] = val;
        recalc();
        renderApp();
      };
    });
    const catPrev = document.getElementById('btn-catalogue-prev');
    const catNext = document.getElementById('btn-catalogue-next');
    if (catPrev) catPrev.onclick = function () { navigate('service'); };
    if (catNext) catNext.onclick = function () { navigate('pages'); };

    // 5. Pages Screen Actions
    const pageTiles = root.querySelectorAll('.right-panel [data-comp-id]');
    pageTiles.forEach(function (tile) {
      tile.onclick = function () {
        const cid = tile.getAttribute('data-comp-id');
        const comp = state.catalog.components.find(function (c) { return c.id === cid; });
        if (!comp || comp.type === 'Included') return;

        if (state.selections[cid]) {
          delete state.selections[cid];
        } else {
          state.selections[cid] = 1;
        }
        recalc();
        renderApp();
      };
    });
    const pagesPrev = document.getElementById('btn-pages-prev');
    const pagesNext = document.getElementById('btn-pages-next');
    if (pagesPrev) pagesPrev.onclick = function () { navigate('catalogue'); };
    if (pagesNext) pagesNext.onclick = function () { navigate('features'); };

    // 6. Features Screen Actions
    const tagPills = root.querySelectorAll('.filter-pill');
    tagPills.forEach(function (pill) {
      pill.onclick = function () {
        state.featureTagFilter = pill.getAttribute('data-tag');
        renderApp();
      };
    });
    const featPrev = document.getElementById('btn-features-prev');
    const featNext = document.getElementById('btn-features-next');
    if (featPrev) featPrev.onclick = function () { navigate('pages'); };
    if (featNext) featNext.onclick = function () { navigate('integrations'); };

    // 7. Integrations Screen Actions
    const intgPrev = document.getElementById('btn-integrations-prev');
    const intgNext = document.getElementById('btn-integrations-next');
    if (intgPrev) intgPrev.onclick = function () { navigate('features'); };
    if (intgNext) intgNext.onclick = function () { navigate('summary'); };

    // 8. Summary Screen Actions
    const editLinks = root.querySelectorAll('[data-jump-screen]');
    editLinks.forEach(function (link) {
      link.onclick = function () {
        navigate(link.getAttribute('data-jump-screen'));
      };
    });
    const sumPrev = document.getElementById('btn-summary-prev');
    const sumNext = document.getElementById('btn-summary-next');
    if (sumPrev) sumPrev.onclick = function () { navigate('integrations'); };
    if (sumNext) sumNext.onclick = function () {
      if (state.isStaff) {
        // Validation for discount reason if discount > max discount
        const maxDisc = (state.catalog.settings.maxStaffDiscount || 0.15) * 100;
        if (state.quoteResult.discountPct > maxDisc && !state.discountReason.trim()) {
          showToast('Please enter a reason for discount above ' + maxDisc + '%.', true);
          return;
        }
      }
      navigate('details');
    };

    // Staff custom line actions
    const addCustomBtn = document.getElementById('btn-add-custom-line');
    if (addCustomBtn) {
      addCustomBtn.onclick = function () {
        state.customLines.push({
          name: 'Custom service ' + (state.customLines.length + 1),
          amount: 1000,
          discountable: true
        });
        recalc();
        renderApp();
      };
    }
    const customInputs = root.querySelectorAll('[data-custom-idx]');
    customInputs.forEach(function (inp) {
      inp.onchange = function () {
        const idx = parseInt(inp.getAttribute('data-custom-idx'), 10);
        const fld = inp.getAttribute('data-field');
        if (fld === 'name') state.customLines[idx].name = inp.value;
        else if (fld === 'amount') state.customLines[idx].amount = Number(inp.value) || 0;
        else if (fld === 'discountable') state.customLines[idx].discountable = inp.checked;
        recalc();
        renderApp();
      };
    });
    const removeCustomBtns = root.querySelectorAll('[data-remove-custom-idx]');
    removeCustomBtns.forEach(function (b) {
      b.onclick = function () {
        const idx = parseInt(b.getAttribute('data-remove-custom-idx'), 10);
        state.customLines.splice(idx, 1);
        recalc();
        renderApp();
      };
    });
    const finalPriceInput = document.getElementById('input-final-price');
    if (finalPriceInput) {
      finalPriceInput.onchange = function () {
        const v = finalPriceInput.value.trim();
        state.finalPriceOverride = v !== '' ? Number(v) : null;
        recalc();
        renderApp();
      };
    }
    const discountReasonInput = document.getElementById('input-discount-reason');
    if (discountReasonInput) {
      discountReasonInput.onchange = function () {
        state.discountReason = discountReasonInput.value;
      };
    }
    const staffNameInput = document.getElementById('input-staff-name');
    if (staffNameInput) {
      staffNameInput.onchange = function () {
        state.staffName = staffNameInput.value;
      };
    }

    // 9. Details Screen Actions
    const bindField = function (id, prop, transform) {
      const el = document.getElementById(id);
      if (el) {
        el.oninput = function () {
          let val = el.value;
          if (transform) val = transform(val);
          state.client[prop] = val;
          if (state.fieldErrors[prop]) {
            delete state.fieldErrors[prop];
          }
          if (prop === 'gstin') {
            const sc = stateCodeFromGstin(val);
            if (sc) {
              state.client.stateCode = sc;
              const selState = document.getElementById('field-state');
              if (selState) selState.value = sc;
            }
          }
          recalc();
        };
      }
    };
    bindField('field-client-name', 'name');
    bindField('field-business-name', 'businessName');
    bindField('field-mobile', 'mobile', function (v) { return v.replace(/\D/g, '').slice(0, 10); });
    bindField('field-email', 'email');
    bindField('field-gstin', 'gstin', function (v) { return v.toUpperCase().slice(0, 15); });
    bindField('field-address', 'address');

    const stateSelect = document.getElementById('field-state');
    if (stateSelect) {
      stateSelect.onchange = function () {
        state.client.stateCode = stateSelect.value;
        recalc();
        renderApp();
      };
    }
    const waCheck = document.getElementById('field-whatsapp');
    if (waCheck) {
      waCheck.onchange = function () {
        state.client.whatsappOptIn = waCheck.checked;
      };
    }

    const detailsPrev = document.getElementById('btn-details-prev');
    if (detailsPrev) detailsPrev.onclick = function () { navigate('summary'); };

    const submitBtn = document.getElementById('btn-submit-estimate');
    if (submitBtn) {
      submitBtn.onclick = function () {
        handleSubmitForm();
      };
    }

    // 10. Confirmation Screen Actions
    const buildAnotherBtn = document.getElementById('btn-build-another');
    if (buildAnotherBtn) {
      buildAnotherBtn.onclick = function () {
        // Reset selections while keeping staff token if in staff session
        state.selections = {};
        state.customLines = [];
        state.finalPriceOverride = null;
        state.discountReason = '';
        state.client = {
          name: '',
          businessName: '',
          mobile: '',
          email: '',
          gstin: '',
          stateCode: '',
          address: '',
          whatsappOptIn: true
        };
        state.submissionResult = null;
        navigate('service');
      };
    }

    // Mobile sticky bar action button
    const mobileActionBtn = document.getElementById('mobile-btn-action');
    if (mobileActionBtn) {
      mobileActionBtn.onclick = function () {
        const sc = state.currentScreen;
        if (sc === 'service') navigate('catalogue');
        else if (sc === 'catalogue') navigate('pages');
        else if (sc === 'pages') navigate('features');
        else if (sc === 'features') navigate('integrations');
        else if (sc === 'integrations') navigate('summary');
        else if (sc === 'summary') navigate('details');
        else if (sc === 'details') handleSubmitForm();
      };
    }
  }

  // --- Form Validation and Submission ---
  function handleSubmitForm() {
    const honeypot = (document.getElementById('field-honeypot') || {}).value;
    if (honeypot) {
      // Spam detected
      console.warn('Bot detected via honeypot.');
      return;
    }

    const errors = {};
    if (!state.client.name.trim()) {
      errors.name = 'Please enter your name.';
    }
    const mobilePattern = /^[6-9][0-9]{9}$/;
    if (!mobilePattern.test(state.client.mobile)) {
      errors.mobile = 'Enter a valid 10-digit mobile number starting with 6-9.';
    }
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    if (!emailPattern.test(state.client.email)) {
      errors.email = 'Enter a valid email address.';
    }
    if (state.client.gstin) {
      const gstinPattern = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
      if (!gstinPattern.test(state.client.gstin)) {
        errors.gstin = 'Enter a valid 15-character GSTIN.';
      }
    }

    state.fieldErrors = errors;
    if (Object.keys(errors).length > 0) {
      renderApp();
      showToast('Please fix the errors highlighted below.', true);
      return;
    }

    // Prepare payload
    const selections = [];
    Object.keys(state.selections).forEach(function (cid) {
      const q = state.selections[cid];
      if (q > 0) selections.push({ componentId: cid, qty: q });
    });

    const payload = {
      serviceId: state.selectedServiceId,
      selections: selections,
      customLines: state.isStaff ? state.customLines : [],
      finalPriceOverride: state.isStaff ? state.finalPriceOverride : null,
      discountReason: state.discountReason,
      staffName: state.staffName,
      client: state.client,
      honeypot: ''
    };

    state.isSubmitting = true;
    renderApp();

    callServer('saveSubmission', payload, state.staffToken)
      .then(function (result) {
        state.isSubmitting = false;
        state.submissionResult = result;
        navigate('confirmation');
      })
      .catch(function (err) {
        state.isSubmitting = false;
        renderApp();
        showToast(err.message || 'Submission failed. Please try again.', true);
      });
  }

  // --- Initialization ---
  function init() {
    callServer('getCatalog', null)
      .then(function (cat) {
        state.catalog = cat;
        recalc();
        renderApp();
      })
      .catch(function (err) {
        const root = document.getElementById('app-root');
        if (root) {
          root.innerHTML = (
            '<div style="padding:40px;text-align:center;">' +
              '<h3 style="color:#DC2626;margin-bottom:8px;">Failed to load catalog</h3>' +
              '<p style="color:#6B7280;margin-bottom:16px;">' + escapeHtml(err.message) + '</p>' +
              '<button class="btn-primary" onclick="window.location.reload()">Try again</button>' +
            '</div>'
          );
        }
      });
  }

  // Start on load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
