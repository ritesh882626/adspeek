<style>
/* ==========================================================================
   AdsPeek Package Builder Design System Tokens & Base Reset
   ========================================================================== */
:root {
  --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  
  /* Color Palette */
  --bg-page: #D9DEEA;
  --bg-card: #FFFFFF;
  --bg-right-panel: #F7F8FB;
  --gradient-left: linear-gradient(145deg, #E6F6ED 0%, #EBF0FA 50%, #E2E8F8 100%);
  
  --color-text-main: #111827;
  --color-text-muted: #6B7280;
  --color-text-subtle: #9CA3AF;
  
  --border-default: #E5E7EB;
  --border-focus: #111827;
  
  /* Tile States */
  --tile-bg: #FFFFFF;
  --tile-border: #E5E7EB;
  --tile-selected-border: #111827;
  --tile-selected-bg: #EEF0FA;
  
  /* Primary Action */
  --btn-primary-bg: #111827;
  --btn-primary-hover: #1F2937;
  --btn-primary-text: #FFFFFF;
  
  /* Badges & Accents */
  --badge-discount-bg: #FEF3C7;
  --badge-discount-text: #B45309;
  --badge-pill-bg: #F3F4F6;
  --badge-pill-text: #4B5563;
  --color-error: #DC2626;
  --bg-error-soft: #FEF2F2;
  
  /* Radius */
  --radius-card: 24px;
  --radius-tile: 14px;
  --radius-control: 10px;
  --radius-pill: 9999px;
  
  /* Shadows */
  --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.12), 0 0 1px rgba(0, 0, 0, 0.15);
  --shadow-price-card: 0 4px 14px rgba(0, 0, 0, 0.04);
}

/* ==========================================================================
   Full Viewport Lock & Base Reset
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  width: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden; /* Page itself NEVER scrolls */
  background-color: var(--bg-page);
  font-family: var(--font-family);
  color: var(--color-text-main);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Accessibility Focus Rings */
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex="0"]:focus-visible {
  outline: 2px solid #111827;
  outline-offset: 2px;
}

/* ==========================================================================
   Modal Overlay Container (Full Screen Overlay)
   ========================================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: var(--bg-page);
  overflow: hidden;
  z-index: 100;
  padding: 24px;
}

/* Main Card Shell - Fixed Size on Desktop */
.app-container {
  width: min(1180px, 100vw - 48px);
  height: min(760px, 100dvh - 48px);
  background-color: var(--bg-card);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.7);
}

/* Top Right Close Button (✕) */
.modal-close-btn {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #FFFFFF;
  border: 1px solid var(--border-default);
  color: #4B5563;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 60;
  transition: all 0.15s ease;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
}

.modal-close-btn:hover {
  background: #F3F4F6;
  color: #111827;
  border-color: #9CA3AF;
  transform: scale(1.05);
}

/* In-app Leave Confirm Modal Overlay */
.inapp-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(17, 24, 39, 0.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2147483647;
  padding: 20px;
}

.inapp-modal-overlay[hidden] {
  display: none !important;
}

.inapp-modal-card {
  background: #FFFFFF;
  border-radius: 16px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.05);
  max-width: 400px;
  width: 100%;
  padding: 24px;
  text-align: center;
  animation: modalPopIn 0.18s ease-out;
}

@keyframes modalPopIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.inapp-modal-card h3 {
  font-size: 17px;
  font-weight: 700;
  color: #111827;
  margin: 0 0 8px 0;
}

.inapp-modal-card p {
  font-size: 13.5px;
  color: #4B5563;
  margin: 0 0 20px 0;
  line-height: 1.45;
}

.inapp-modal-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.inapp-modal-actions button {
  flex: 1;
  padding: 10px 16px;
  font-size: 13.5px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn-secondary {
  background: #F3F4F6;
  border: 1px solid #D1D5DB;
  color: #374151;
}

.btn-secondary:hover {
  background: #E5E7EB;
  color: #111827;
}

.btn-danger {
  background: #DC2626;
  border: 1px solid #DC2626;
  color: #FFFFFF;
}

.btn-danger:hover {
  background: #B91C1C;
}

/* Staff mode top strip */
.staff-strip {
  background-color: #111827;
  color: #FFFFFF;
  height: 34px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.02em;
  z-index: 55;
  flex-shrink: 0;
}

.staff-strip .logout-btn {
  color: #9CA3AF;
  text-decoration: underline;
  cursor: pointer;
  background: none;
  border: none;
  font-size: 11.5px;
  font-family: inherit;
  transition: color 0.15s ease;
}

.staff-strip .logout-btn:hover {
  color: #FFFFFF;
}

/* ==========================================================================
   Split Card Layout (Desktop & Tablet)
   ========================================================================== */
.split-card {
  display: flex;
  flex: 1;
  min-height: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
}

/* Left Panel - Fixed Grid (Auto / 1fr / Auto) */
.left-panel {
  width: 38%;
  min-width: 320px;
  background: var(--gradient-left);
  padding: 34px 30px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 0;
  overflow: hidden;
  border-right: 1px solid rgba(229, 231, 235, 0.7);
  flex-shrink: 0;
}

.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.brand-logo-sq {
  width: 32px;
  height: 32px;
  border: 1.5px solid #111827;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: -0.02em;
  color: #111827;
  background: #FFFFFF;
}

.brand-text {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #111827;
}

.left-panel-content {
  overflow: hidden;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

.left-title {
  font-size: 26px;
  font-weight: 700;
  line-height: 1.25;
  color: #111827;
  letter-spacing: -0.025em;
  margin-bottom: 10px;
}

.left-desc {
  font-size: 13.5px;
  color: var(--color-text-muted);
  line-height: 1.5;
  margin-bottom: 18px;
}

.benefit-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 18px;
}

.benefit-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 500;
  color: #374151;
}

.benefit-icon {
  width: 17px;
  height: 17px;
  stroke-width: 2.2;
  color: #111827;
  flex-shrink: 0;
}

/* Left Panel Live Price Card (Always pinned at bottom of left panel) */
.price-card {
  background: #FFFFFF;
  border-radius: 16px;
  padding: 18px 20px;
  box-shadow: var(--shadow-price-card);
  border: 1px solid rgba(229, 231, 235, 0.8);
  margin-top: auto;
  flex-shrink: 0;
}

.price-card-label {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--color-text-muted);
  margin-bottom: 3px;
}

.price-card-amount {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: #111827;
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.price-pulse {
  animation: pricePulse 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes pricePulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.035); }
  100% { transform: scale(1); }
}

.price-card-subtext {
  font-size: 11.5px;
  color: var(--color-text-subtle);
  margin-top: 3px;
}

/* ==========================================================================
   Right Panel - Fixed 3-Row Grid (Header / Options Scroll Area / Footer)
   ========================================================================== */
.right-panel {
  flex: 1;
  background-color: var(--bg-right-panel);
  padding: 34px 38px 24px 38px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 0;
  height: 100%;
  overflow: hidden;
  position: relative;
}

/* 1. Header (Fixed at top) */
.screen-header-wrap {
  grid-row: 1;
  margin-bottom: 16px;
  flex-shrink: 0;
  padding-right: 32px; /* Avoid overlapping close button */
}

.screen-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #111827;
  margin-bottom: 3px;
}

.screen-subtitle {
  font-size: 13px;
  color: var(--color-text-muted);
}

/* 7 Step Dots */
.step-dots-container {
  margin-top: 14px;
  margin-bottom: 14px;
  position: relative;
  display: flex;
  align-items: center;
  width: 210px;
}

.step-dots-line {
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 2px;
  background-color: #E5E7EB;
  z-index: 1;
  transform: translateY(-50%);
}

.step-dots-progress {
  position: absolute;
  top: 50%;
  left: 0;
  height: 2px;
  background-color: #111827;
  z-index: 2;
  transform: translateY(-50%);
  transition: width 0.25s ease;
}

.step-dots-wrapper {
  position: relative;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  width: 100%;
}

.step-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: #D1D5DB;
  border: 1.5px solid #F7F8FB;
  transition: all 0.2s ease;
}

.step-dot.active {
  background-color: #111827;
  transform: scale(1.2);
}

.step-dot.completed {
  background-color: #111827;
}

/* 2. Options Area (THE ONLY SCROLLING REGION) */
.options-scroll-area {
  grid-row: 2;
  overflow-y: auto;
  overscroll-behavior: contain;
  min-height: 0;
  padding-right: 8px;
  padding-bottom: 12px;
}

/* Styled Scrollbars */
.options-scroll-area::-webkit-scrollbar {
  width: 6px;
}

.options-scroll-area::-webkit-scrollbar-track {
  background: transparent;
}

.options-scroll-area::-webkit-scrollbar-thumb {
  background: #CBD5E1;
  border-radius: 9999px;
}

.options-scroll-area::-webkit-scrollbar-thumb:hover {
  background: #94A3B8;
}

/* 3. Footer (Fixed at bottom) */
.screen-footer-wrap {
  grid-row: 3;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  background-color: var(--bg-right-panel);
}

.screen-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 14px;
  border-top: 1px solid rgba(229, 231, 235, 0.8);
  flex-shrink: 0;
  background-color: var(--bg-right-panel);
}

.prev-step-btn {
  background: none;
  border: none;
  color: var(--color-text-muted);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: color 0.15s ease;
  padding: 6px 0;
}

.prev-step-btn:hover {
  color: #111827;
}

.btn-primary {
  background-color: var(--btn-primary-bg);
  color: var(--btn-primary-text);
  border: none;
  border-radius: var(--radius-control);
  padding: 11px 26px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 42px;
}

.btn-primary:hover:not(:disabled) {
  background-color: var(--btn-primary-hover);
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ==========================================================================
   Tiles & Grids (No invalid nested buttons)
   ========================================================================== */
.tiles-grid-1 {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.tiles-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.tile {
  background-color: var(--tile-bg);
  border: 1px solid var(--tile-border);
  border-radius: var(--radius-tile);
  position: relative;
  transition: all 0.15s ease;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.tile:hover:not(.disabled) {
  border-color: #94A3B8;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}

.tile.selected {
  border: 1.5px solid var(--tile-selected-border);
  background-color: var(--tile-selected-bg);
}

.tile.disabled {
  background-color: #F9FAFB;
  opacity: 0.65;
  cursor: not-allowed;
  border-color: #E5E7EB;
}

/* Main clickable area of the tile */
.tile-main-btn {
  width: 100%;
  background: none;
  border: none;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  position: relative;
  min-height: 64px;
}

.tile.disabled .tile-main-btn {
  cursor: not-allowed;
}

.tile-check-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background-color: #111827;
  color: #FFFFFF;
  display: none;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.tile.selected .tile-check-badge {
  display: flex;
}

.tile-icon-box {
  width: 38px;
  height: 38px;
  border-radius: 9px;
  background-color: #F3F4F6;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 12px;
  flex-shrink: 0;
  color: #111827;
}

.tile.selected .tile-icon-box {
  background-color: #FFFFFF;
}

.tile-content {
  flex: 1;
  min-width: 0;
}

.tile-title {
  font-size: 13.5px;
  font-weight: 600;
  color: #111827;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tile-desc {
  font-size: 11.5px;
  color: var(--color-text-muted);
  margin-top: 2px;
  line-height: 1.35;
}

.tile-side {
  text-align: right;
  margin-left: 10px;
  flex-shrink: 0;
}

.tile-price {
  font-size: 13px;
  font-weight: 600;
  color: #111827;
}

.tile-pill {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: var(--radius-pill);
  background: var(--badge-pill-bg);
  color: var(--badge-pill-text);
  display: inline-block;
}

.staff-pill {
  background: #FEF3C7;
  color: #92400E;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 5px;
  border-radius: 4px;
  margin-left: 6px;
}

/* Optional + Qty Stepper embedded in Tile (outside .tile-main-btn) */
.tile-stepper-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px 12px 16px;
  border-top: 1px solid rgba(229, 231, 235, 0.8);
  background-color: rgba(255, 255, 255, 0.6);
}

/* ==========================================================================
   Steppers & Controls
   ========================================================================== */
.stepper-card {
  background: #FFFFFF;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-tile);
  padding: 16px 18px;
  margin-bottom: 12px;
}

.stepper-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.stepper-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.stepper-title {
  font-size: 13.5px;
  font-weight: 600;
  color: #111827;
}

.stepper-control {
  display: flex;
  align-items: center;
  gap: 6px;
}

.stepper-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border-default);
  background: #FFFFFF;
  color: #111827;
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  transition: all 0.1s ease;
}

.stepper-btn:hover:not(:disabled) {
  background: #F3F4F6;
  border-color: #CBD5E1;
}

.stepper-btn:active:not(:disabled) {
  background: #E5E7EB;
}

.stepper-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.stepper-input {
  width: 52px;
  height: 32px;
  text-align: center;
  border: 1px solid var(--border-default);
  border-radius: 8px;
  font-size: 13.5px;
  font-weight: 600;
  color: #111827;
  background: #FFFFFF;
  font-family: inherit;
}

.stepper-helper {
  font-size: 11.5px;
  color: var(--color-text-muted);
  margin-left: 50px;
}

/* ==========================================================================
   Chips & Locked Inclusions
   ========================================================================== */
.section-group-label {
  font-size: 12px;
  font-weight: 600;
  color: #4B5563;
  margin-bottom: 8px;
}

.locked-chips-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
}

.locked-chip {
  background: #FFFFFF;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-control);
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 500;
  color: #374151;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.locked-chip-icon {
  width: 13px;
  height: 13px;
  color: #6B7280;
}

/* Filter Pills */
.filter-pills {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  overflow-x: auto;
  padding-bottom: 2px;
}

.filter-pill {
  border-radius: var(--radius-pill);
  padding: 5px 13px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--border-default);
  background: #FFFFFF;
  color: #4B5563;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}

.filter-pill.active {
  background: #111827;
  color: #FFFFFF;
  border-color: #111827;
}

/* Info Callout Box */
.info-callout {
  background-color: #EEF2FF;
  border: 1px solid #E0E7FF;
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 12px;
  color: #3730A3;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
}

/* ==========================================================================
   Summary View - Scrolling Items & Fixed Totals
   ========================================================================== */
.summary-items-list {
  background: #FFFFFF;
  border: 1px solid var(--border-default);
  border-radius: 16px;
  padding: 16px 20px;
  margin-bottom: 14px;
}

.summary-group {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #F3F4F6;
}

.summary-group:last-child {
  border-bottom: none;
}

.summary-group-title-col {
  width: 120px;
  flex-shrink: 0;
}

.summary-group-name {
  font-size: 13px;
  font-weight: 600;
  color: #111827;
  display: flex;
  align-items: center;
  gap: 8px;
}

.summary-edit-link {
  font-size: 11px;
  font-weight: 500;
  color: #6B7280;
  text-decoration: underline;
  cursor: pointer;
}

.summary-group-items-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.summary-item-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12.5px;
  color: #374151;
}

.summary-item-name {
  font-weight: 400;
}

.summary-item-amount {
  font-weight: 500;
  color: #111827;
  margin-left: 12px;
  white-space: nowrap;
}

/* Fixed Totals Box (direct above footer) */
.summary-totals-fixed {
  background: #FFFFFF;
  border: 1px solid var(--border-default);
